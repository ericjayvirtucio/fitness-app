appId: com.fitnessapp.dev
---
# Restore now lives inside Data controls with export and deletion, so the flow
# goes through that screen rather than tapping a Profile action directly. Data
# controls is reachable from both profile states, so this one flow works on a
# fresh install and on a populated one.
- runFlow: ../data-lifecycle/open-data-controls.yaml
- scrollUntilVisible:
    element:
      id: open-data-restore
    direction: DOWN
- tapOn:
    id: open-data-restore
- assertVisible:
    id: data-restore-screen
