appId: com.fitnessapp.dev
---
# Deletes the completed workout that is already open, through the destructive
# confirmation the product shows. Deletion always starts from completed history,
# never from the active workout screen.
#
# WORKOUT_NAME is deliberately required rather than defaulted, because a flow's
# own `env` block is applied after the caller's `runFlow` env and overrides it.
- scrollUntilVisible:
    element:
      id: delete-completed-workout
    direction: DOWN
- tapOn:
    id: delete-completed-workout
- assertVisible: 'Delete ${WORKOUT_NAME}.*'
# The alert title ends in a question mark, so this full match reaches the
# destructive action rather than the title above it.
- tapOn: Delete Workout
- assertVisible: Workout History
- assertVisible: Completed workout deleted.
