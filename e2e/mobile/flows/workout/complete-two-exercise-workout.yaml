appId: com.fitnessapp.dev
---
# Completes one workout holding two exercises with one recorded set each,
# through the same public screens a person uses. Both repetition counts are
# parameters so a suite can tell the two exercises apart by their results.
#
# PUSH_UP_REPETITIONS and SQUAT_REPETITIONS are deliberately required rather
# than defaulted, because a flow's own `env` block is applied after the caller's
# `runFlow` env and overrides it. An unset variable fails loudly instead.
#
# The picker lists recently performed exercises first and falls back to the
# whole catalog only when no completed workout exists yet, so this flow must run
# as the first completed workout of a scenario for "Add E2E Squat" to be on
# screen without searching.
- tapOn:
    id: tab-workout
- tapOn: Start Empty Workout
- assertVisible: Workout
- tapOn: Add Exercise
# The picker now carries a filter control between its search field and its
# cards, so the first card sits lower than it did.
- scrollUntilVisible:
    element:
      text: Add E2E Push-up
    direction: DOWN
    centerElement: true
- tapOn: Add E2E Push-up
- tapOn: Add Set for E2E Push-up
- tapOn:
    id: workout-set-repetitions-input
- inputText: ${PUSH_UP_REPETITIONS}
- tapOn: Save Set
- assertVisible: 'Set 1: ${PUSH_UP_REPETITIONS} reps'
- scrollUntilVisible:
    element:
      text: Add Exercise
    direction: DOWN
    centerElement: true
- tapOn: Add Exercise
# The picker lists every catalog definition, and the first exercise's card is
# still above it, so the second definition can sit below the fold.
- scrollUntilVisible:
    element:
      text: Add E2E Squat
    direction: DOWN
    centerElement: true
- tapOn: Add E2E Squat
- scrollUntilVisible:
    element:
      text: Add Set for E2E Squat
    direction: DOWN
    centerElement: true
- tapOn: Add Set for E2E Squat
- tapOn:
    id: workout-set-repetitions-input
- inputText: ${SQUAT_REPETITIONS}
# The second exercise's set form sits far enough down the workout that the
# number pad covers its Save Set control, so tapping it blind lands on a key and
# appends that digit to the field. `hideKeyboard` cannot help: the iOS number pad
# exposes no dismiss action. A short drag does, because the screen sets
# keyboardDismissMode="on-drag".
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Save Set
    direction: DOWN
    centerElement: true
- tapOn: Save Set
- scrollUntilVisible:
    element:
      text: 'Set 1: ${SQUAT_REPETITIONS} reps'
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      text: Finish Workout
    direction: DOWN
    centerElement: true
- tapOn: Finish Workout
- tapOn:
    text: Finish Workout
    index: 0
