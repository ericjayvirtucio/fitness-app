appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-workout
# Weekday cards are keyed by the domain Weekday value, where Monday is 1.
- tapOn:
    id: weekday-card-1
- assertVisible: Plan Monday
- tapOn: Workout name
- inputText: E2E Push Day
- tapOn: Add exercise
- tapOn: Add E2E Push-upa
- tapOn: Sets
- inputText: '3'
- tapOn: Repetitions
- inputText: '8'
- scrollUntilVisible:
    element:
      text: Save workout
    direction: DOWN
- tapOn: Save workout
- assertVisible: E2E Push Day
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- assertVisible: E2E Push Day
