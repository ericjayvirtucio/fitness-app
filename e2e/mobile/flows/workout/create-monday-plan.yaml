appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-workout
# Weekday cards are keyed by the domain Weekday value, where Monday is 1.
- tapOn:
    id: weekday-card-1
- assertVisible: Plan Monday
# A short drag dismisses the keyboard between fields, because the screen uses
# keyboardDismissMode="on-drag". Without it the keyboard covers the next
# control and text lands in the previous field.
- tapOn:
    id: planned-workout-name
- inputText: E2E Push Day
- swipe:
    start: 50%, 45%
    end: 50%, 40%
- scrollUntilVisible:
    element:
      text: Add exercise
    direction: DOWN
- tapOn: Add exercise
# The picker now carries a filter control between its search field and its
# cards, so the first card sits lower than it did.
- scrollUntilVisible:
    element:
      text: Add E2E Push-up
    direction: DOWN
    centerElement: true
- tapOn: Add E2E Push-up
- scrollUntilVisible:
    element:
      id: planned-sets-0
    direction: DOWN
- tapOn:
    id: planned-sets-0
- eraseText: 6
- inputText: '3'
- swipe:
    start: 50%, 45%
    end: 50%, 40%
- scrollUntilVisible:
    element:
      id: planned-repetitions-0
    direction: DOWN
- tapOn:
    id: planned-repetitions-0
- eraseText: 6
- inputText: '8'
- swipe:
    start: 50%, 45%
    end: 50%, 40%
- scrollUntilVisible:
    element:
      id: save-planned-workout
    direction: DOWN
- tapOn:
    id: save-planned-workout
- assertVisible: 'Edit Monday, E2E Push Day'
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- assertVisible: 'Edit Monday, E2E Push Day'
