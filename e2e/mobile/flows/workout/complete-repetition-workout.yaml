appId: com.fitnessapp.dev
---
# Completes one workout with a single recorded repetition set, through the same
# public screens a person uses. The repetition count is a parameter so a suite
# can record a better result, then a weaker one, without a second flow.
#
# REPETITIONS is deliberately required rather than defaulted here. A flow's own
# `env` block is applied after the caller's `runFlow` env and overrides it, so a
# default silently replaced every value a suite passed in. An unset variable now
# fails loudly instead.
- tapOn:
    id: tab-workout
- tapOn: Start Empty Workout
- assertVisible: Workout
- tapOn: Add Exercise
- tapOn: Add E2E Push-up
- tapOn: Add Set for E2E Push-up
- tapOn:
    id: workout-set-repetitions-input
- inputText: ${REPETITIONS}
- tapOn: Save Set
- assertVisible: 'Set 1: ${REPETITIONS} reps'
- tapOn: Finish Workout
- tapOn:
    text: Finish Workout
    index: 0
