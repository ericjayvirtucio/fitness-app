appId: com.fitnessapp.dev
---
# Completes one workout with a single recorded repetition set, through the same
# public screens a person uses. The repetition count is a parameter so a suite
# can record a better result, then a weaker one, without a second flow.
#
# REPETITIONS is deliberately required rather than defaulted here. A flow's own
# `env` block is applied after the caller's `runFlow` env and overrides it, so a
# default silently replaced every value a suite passed in. An unset variable now
# fails loudly instead.
- tapOn:
    id: tab-workout
- tapOn: Start Empty Workout
- assertVisible: Workout
- tapOn: Add Exercise
# The picker now carries a filter control between its search field and its
# cards, so the first card sits lower than it did. A flow that worked against a
# shorter picker is not evidence that it works against a taller one; scroll to
# the card rather than tapping where it used to be.
- scrollUntilVisible:
    element:
      text: Add E2E Push-up
    direction: DOWN
    centerElement: true
- tapOn: Add E2E Push-up
- tapOn: Add Set for E2E Push-up
- tapOn:
    id: workout-set-repetitions-input
- inputText: ${REPETITIONS}
- tapOn: Save Set
- assertVisible: 'Set 1: ${REPETITIONS} reps'
# The active workout now carries a naming control under its heading, so every
# control below it sits one row lower than it did. Scroll to the finish control
# rather than tapping where it used to be; this is a no-op when it is already
# visible.
- scrollUntilVisible:
    element:
      text: Finish Workout
    direction: DOWN
    centerElement: true
- tapOn: Finish Workout
- tapOn:
    text: Finish Workout
    index: 0
