appId: com.fitnessapp.dev
---
# Reaches the personal records of the assisted exercise the way the product
# does: Workout, History, then the exercise as completed history names it.
#
# A second flow beside `open-exercise-personal-records.yaml` rather than a
# parameter on it: that flow is composed by eleven scenarios across four
# suites, and a required variable would have to be threaded through every one of
# them to serve the two names this harness actually uses.
#
# Scroll to the exercise card itself rather than to the "Exercise progress"
# heading above it. Each completed workout adds a history card, so stopping at
# the heading leaves the card below the fold as soon as a suite records more
# than one workout.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Workout History
    direction: DOWN
- tapOn: Open Workout History
- assertVisible: Workout History
- scrollUntilVisible:
    element:
      text: Open performance history for E2E Assisted Pull-up
    direction: DOWN
- tapOn: Open performance history for E2E Assisted Pull-up
- assertVisible: Personal records
