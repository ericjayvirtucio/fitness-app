appId: com.fitnessapp.dev
---
# Reaches the personal records of a performed exercise the way the product does:
# Workout, History, then the exercise as completed history names it.
#
# Scroll to the exercise card itself rather than to the "Exercise progress"
# heading above it. Each completed workout adds a history card, so stopping at
# the heading leaves the card below the fold as soon as a suite records more
# than one workout.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Workout History
    direction: DOWN
- tapOn: Open Workout History
- assertVisible: Workout History
- scrollUntilVisible:
    element:
      text: Open performance history for E2E Push-up
    direction: DOWN
- tapOn: Open performance history for E2E Push-up
- assertVisible: Personal records
