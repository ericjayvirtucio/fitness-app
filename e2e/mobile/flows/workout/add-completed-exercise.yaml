appId: com.fitnessapp.dev
---
# Adds one exercise, with the first set it recorded, to the completed workout
# that is already open. Addition always starts from completed history, never
# from the active workout screen.
#
# EXERCISE_NAME and REPETITIONS are deliberately required rather than defaulted,
# because a flow's own `env` block is applied after the caller's `runFlow` env
# and overrides it.
#
# The entry point sits below the exercise list, which grows with the workout, so
# it is scrolled to rather than assumed to be on screen.
- scrollUntilVisible:
    element:
      id: add-completed-workout-exercise
    direction: DOWN
    centerElement: true
- tapOn:
    id: add-completed-workout-exercise
- assertVisible: Add exercise to this workout
# The picker lists recently performed exercises first as soon as one completed
# workout exists, and every addition scenario runs after one, so an exercise
# that has never been performed is absent until it is searched for.
- tapOn:
    id: exercise-picker-search
- inputText: ${EXERCISE_NAME}
# The text keyboard covers the results, and scrolling with it open drags across
# the keys. A short drag dismisses it, because the screen sets
# keyboardDismissMode="on-drag".
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Add ${EXERCISE_NAME}
    direction: DOWN
    centerElement: true
- tapOn: Add ${EXERCISE_NAME}
- assertVisible: Record what you performed
- tapOn:
    id: workout-set-repetitions-input
- inputText: ${REPETITIONS}
# The number pad covers the save control, and tapping it blind lands on a key
# and appends that digit to the field. `hideKeyboard` cannot help: the iOS
# number pad exposes no dismiss action. A short drag does.
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Add Exercise And Set
    direction: DOWN
    centerElement: true
- tapOn: Add Exercise And Set
- assertVisible:
    id: completed-workout-screen
# The polite confirmation sits at the very bottom of the refreshed detail, below
# the deletion section, so a scenario that wants it scrolls to it deliberately
# rather than having this flow leave every caller scrolled to the end.
