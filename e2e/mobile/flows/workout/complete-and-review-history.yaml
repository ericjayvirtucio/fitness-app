appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-workout
- tapOn: Start Empty Workout
- assertVisible: Workout
- tapOn: Add Exercise
# The picker now carries a filter control between its search field and its
# cards, so the first card sits lower than it did.
- scrollUntilVisible:
    element:
      text: Add E2E Push-up
    direction: DOWN
    centerElement: true
- tapOn: Add E2E Push-up
- tapOn: Add Set for E2E Push-up
- tapOn:
    id: workout-set-repetitions-input
- inputText: '12'
- tapOn: Save Set
- assertVisible: 'Set 1: 12 reps'
- tapOn: Finish Workout
- tapOn:
    text: Finish Workout
    index: 0
- scrollUntilVisible:
    element:
      text: Open Workout History
    direction: DOWN
- tapOn: Open Workout History
- assertVisible: Workout History
# The performed summary states its recorded load volume in both directions, so a
# reps-only workout produces the sentence saying there is none where it once
# produced no line at all. Workout History is taller than one viewport either
# way, and that line is enough to push the first completed card below the fold.
- scrollUntilVisible:
    element:
      id: completed-workout-card
    direction: DOWN
    centerElement: true
- assertVisible: 'Open Workout,.*1 actual sets.*'
- tapOn:
    id: completed-workout-card
- assertVisible: 'Performed set 1: 12 reps'
# Completed history is correctable but is never an active workout, so its own
# correction controls appear while the execution controls stay absent.
- assertVisible: Correct recorded set 1 for E2E Push-up
- assertNotVisible: Finish Workout
- assertNotVisible: Discard Workout
- assertNotVisible: Add Exercise
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Workout History
    direction: DOWN
- tapOn: Open Workout History
- scrollUntilVisible:
    element:
      id: completed-workout-card
    direction: DOWN
    centerElement: true
- assertVisible: 'Open Workout,.*1 actual sets.*'
- scrollUntilVisible:
    element:
      text: Exercise progress
    direction: DOWN
- tapOn: Open performance history for E2E Push-up
- assertVisible: 'Open Workout,.*1 actual sets, 12 repetitions'
- tapOn: 'Open Workout,.*1 actual sets, 12 repetitions'
- assertVisible: 'Performed set 1: 12 reps'
