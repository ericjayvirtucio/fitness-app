appId: com.fitnessapp.dev
---
# Completes one workout with a single recorded added-load set, through the same
# public screens a person uses. It mirrors `complete-assisted-workout.yaml`
# exactly, because the two exist to be compared: the same mass under a different
# logging mode must produce a different sentence.
#
# ADDED_WEIGHT and REPETITIONS are deliberately required rather than defaulted. A
# flow's own `env` block is applied after the caller's `runFlow` env and
# overrides it, so a default silently replaces every value a suite passes in.
- tapOn:
    id: tab-workout
- tapOn: Start Empty Workout
- assertVisible: Workout
- tapOn: Add Exercise
# The picker lists recently performed exercises first as soon as one completed
# workout exists, and falls back to the whole catalog only before that. This
# flow is composed both ways — alone in the Sprint 32 suite, and after an
# assisted workout in regression — and an exercise that has never been performed
# is absent from the recents list, so it is searched for rather than scrolled to.
- tapOn:
    id: exercise-picker-search
- inputText: E2E Weighted Dip
# Dismissed with the return key rather than with the short drag other flows use.
# `keyboardDismissMode="on-drag"` fires on a scroll drag, and a picker filtered
# down to one card has nothing left to scroll, so the drag is swallowed and the
# keyboard stays up. It then covers the only result: Maestro's hierarchy has no
# notion of the keyboard, so the card reads as fully visible, the tap aimed at it
# lands on the QuickType row instead, and the suggestion is appended to the
# search field that still has focus — "E2E Weighted Dip" became
# "E2E Weighted Dipping", the filter matched nothing, and the exercise was never
# added.
- pressKey: Enter
# The picker carries a filter control between its search field and its cards, so
# the first card sits lower than an unfiltered list would suggest.
- scrollUntilVisible:
    element:
      text: Add E2E Weighted Dip
    direction: DOWN
    centerElement: true
- tapOn: Add E2E Weighted Dip
- tapOn: Add Set for E2E Weighted Dip
# Filled bottom-up, and that is not a style choice. The mass field sits above
# repetitions, so filling top-down leaves the number pad covering the
# repetitions field: the tap meant for it lands on a key instead, and the digit
# is appended to the mass field that still has focus. Reaching the higher field
# second means the pad is never between a tap and its target.
#
# Both fields are reached by identifier rather than by text, because the mass
# field's visible label and its accessible name are the same string.
- tapOn:
    id: workout-set-repetitions-input
- inputText: ${REPETITIONS}
- tapOn:
    id: workout-set-resistance-input
- inputText: ${ADDED_WEIGHT}
# The number pad covers the save control, and scrolling with it open drags
# across the keys and appends digits to the field. `hideKeyboard` cannot help:
# the iOS number pad exposes no dismiss action. A short drag in the content area
# does, because the screen sets keyboardDismissMode="on-drag".
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- tapOn: Save Set
- assertVisible: 'Set 1: Added ${ADDED_WEIGHT} kg × ${REPETITIONS}'
# The active workout now carries a naming control under its heading, so every
# control below it sits one row lower than it did. Scroll to the finish control
# rather than tapping where it used to be; this is a no-op when it is already
# visible.
- scrollUntilVisible:
    element:
      text: Finish Workout
    direction: DOWN
    centerElement: true
- tapOn: Finish Workout
- tapOn:
    text: Finish Workout
    index: 0
