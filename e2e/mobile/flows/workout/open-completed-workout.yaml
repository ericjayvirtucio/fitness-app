appId: com.fitnessapp.dev
---
# Reaches the most recent completed workout the way the product does: Workout,
# History, then the completed card. Correction always starts from history, never
# from the active workout screen.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Workout History
    direction: DOWN
- tapOn: Open Workout History
- assertVisible: Workout History
# Workout History is taller than one viewport. The performed summary now states
# its recorded load volume in both directions — the covered total, or the
# sentence saying there is none — so the summary is one line tall for this
# dimension whatever was recorded, and no longer changes height with the
# fixture. It is still tall enough to push "Workouts in this period" and the
# first card below the fold, so the card is scrolled to rather than tapped where
# it sits.
# Scrolling is a no-op when it is already visible.
- scrollUntilVisible:
    element:
      id: completed-workout-card
    direction: DOWN
    centerElement: true
- tapOn:
    id: completed-workout-card
- assertVisible:
    id: completed-workout-screen
