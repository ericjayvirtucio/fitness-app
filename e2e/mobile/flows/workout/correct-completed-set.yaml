appId: com.fitnessapp.dev
---
# Corrects one recorded set from an already open completed workout. The
# repetition count is a parameter so a suite can overstate a result and then
# correct it without a second flow.
#
# CORRECTED_REPETITIONS and SET_NUMBER are deliberately required rather than
# defaulted, because a flow's own `env` block is applied after the caller's
# `runFlow` env and overrides it.
- scrollUntilVisible:
    element:
      text: Correct recorded set ${SET_NUMBER} for E2E Push-up
    direction: DOWN
- tapOn: Correct recorded set ${SET_NUMBER} for E2E Push-up
- assertVisible: Correct recorded set
- assertVisible: Edit recorded result
- tapOn:
    id: workout-set-repetitions-input
- eraseText
- inputText: ${CORRECTED_REPETITIONS}
# The number pad covers the save control, and scrolling with it open drags
# across the keys and appends digits to the field being corrected. Dismiss it
# before looking for the button.
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Save Correction
    direction: DOWN
- tapOn: Save Correction
- assertVisible:
    id: completed-workout-screen
