appId: com.fitnessapp.dev
---
# Completes one workout with a single recorded assisted set, through the same
# public screens a person uses. Assistance and repetitions are both parameters
# so a suite can record a first result, need less assistance, then need more,
# without a second flow.
#
# ASSISTANCE and REPETITIONS are deliberately required rather than defaulted. A
# flow's own `env` block is applied after the caller's `runFlow` env and
# overrides it, so a default silently replaces every value a suite passes in.
# An unset variable now fails loudly instead.
- tapOn:
    id: tab-workout
- tapOn: Start Empty Workout
- assertVisible: Workout
- tapOn: Add Exercise
# The picker carries a filter control between its search field and its cards, so
# the first card sits lower than an unfiltered list would suggest. Scroll to the
# card rather than tapping where it used to sit.
- scrollUntilVisible:
    element:
      text: Add E2E Assisted Pull-up
    direction: DOWN
    centerElement: true
- tapOn: Add E2E Assisted Pull-up
- tapOn: Add Set for E2E Assisted Pull-up
# Filled bottom-up, and that is not a style choice. Assistance sits above
# repetitions, so filling top-down leaves the number pad covering the
# repetitions field: the tap meant for it lands on a key instead, and the digit
# is appended to the assistance field that still has focus. That is exactly what
# the first run of this flow did — "20" became "2028", repetitions stayed empty,
# and the product correctly refused the set. Reaching the higher field second
# means the pad is never between a tap and its target.
#
# Both fields are reached by identifier rather than by text: the assistance
# field's visible label and its accessible name are both "Assistance (kg)", so a
# text selector cannot say which of the two a step meant.
- tapOn:
    id: workout-set-repetitions-input
- inputText: ${REPETITIONS}
- tapOn:
    id: workout-set-resistance-input
- inputText: ${ASSISTANCE}
# The number pad covers the save control, and scrolling with it open drags
# across the keys and appends digits to the field. `hideKeyboard` cannot help:
# the iOS number pad exposes no dismiss action. A short drag in the content area
# does, because the screen sets keyboardDismissMode="on-drag".
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- tapOn: Save Set
# The active session states what the mass means before it states the mass. Three
# logging modes store a resistance result, and only assistance and added load are
# marked, so this sentence is what proves the set was recorded as assistance
# rather than as weight lifted.
- assertVisible: 'Set 1: Assistance ${ASSISTANCE} kg × ${REPETITIONS}'
# The active workout now carries a naming control under its heading, so every
# control below it sits one row lower than it did. Scroll to the finish control
# rather than tapping where it used to be; this is a no-op when it is already
# visible.
- scrollUntilVisible:
    element:
      text: Finish Workout
    direction: DOWN
    centerElement: true
- tapOn: Finish Workout
- tapOn:
    text: Finish Workout
    index: 0
