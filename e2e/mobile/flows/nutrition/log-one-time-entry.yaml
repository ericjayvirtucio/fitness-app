appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-nutrition
- assertVisible: Nutrition
- tapOn: Add food or beverage
- tapOn: Enter one-time item
- assertVisible: Add food or beverage
- tapOn:
    id: nutrition-description-input
    point: 50%,50%
- inputText: E2E Banana
- scrollUntilVisible:
    element:
      text: Reference amount (grams)
    direction: DOWN
- tapOn:
    id: nutrition-reference-amount-input
    point: 50%,50%
- inputText: '100'
- scrollUntilVisible:
    element:
      text: Energy per reference (kcal)
    direction: DOWN
- tapOn:
    id: nutrition-energy-input
    point: 50%,50%
- inputText: '89'
- scrollUntilVisible:
    element:
      text: Consumed amount (grams)
    direction: DOWN
- tapOn:
    id: nutrition-consumed-amount-input
    point: 50%,50%
- inputText: '100'
- scrollUntilVisible:
    element:
      text: Save entry
    direction: DOWN
- tapOn: Save entry
- assertVisible: E2E Banana
- assertVisible: 89 kcal
