appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-nutrition
- assertVisible: Nutrition
- tapOn: Add food or beverage
- tapOn: Enter one-time item
- assertVisible: Add food or beverage
- tapOn:
    id: nutrition-description-input
- inputText: E2E Banana
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-reference-amount-input
    direction: DOWN
- tapOn:
    point: 50%,23%
- inputText: '100'
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-energy-input
    direction: DOWN
- tapOn:
    point: 50%,23%
- inputText: '89'
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-consumed-amount-input
    direction: DOWN
- tapOn:
    point: 50%,23%
- inputText: '100'
- swipe:
    start: 50%,55%
    end: 50%,10%
    duration: 500
- tapOn: Save entry
- assertVisible: E2E Banana
- assertVisible: 89 kcal
