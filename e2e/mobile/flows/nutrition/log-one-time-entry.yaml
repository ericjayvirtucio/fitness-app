appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-nutrition
- assertVisible: Nutrition
- tapOn: Add food or beverage
- tapOn: Enter one-time item
- assertVisible: Add food or beverage
- tapOn:
    id: nutrition-description-input-touch-target
- inputText: E2E Banana
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-reference-amount-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-reference-amount-input-touch-target
- inputText: '100'
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-energy-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-energy-input-touch-target
- inputText: '89'
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-consumed-amount-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-consumed-amount-input-touch-target
- inputText: '100'
- swipe:
    start: 50%,55%
    end: 50%,10%
    duration: 500
- tapOn: Save entry
- assertVisible: Add nutrition
- swipe:
    start: 1%,50%
    end: 95%,50%
    duration: 300
- assertVisible: Nutrition
- scrollUntilVisible:
    centerElement: true
    element:
      text: '.*E2E Banana.*'
    direction: DOWN
- assertVisible: '.*E2E Banana.*'
- assertVisible: '.*89 kcal.*'
