appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-nutrition
- assertVisible: Nutrition
# The navigation controls are AppButtons, which are read by their accessible
# label rather than by the "Previous" and "Next" text they display.
- tapOn: Previous day
- tapOn: Add food or beverage
- tapOn: Enter one-time item
- assertVisible: Add food or beverage
- tapOn:
    id: nutrition-description-input-touch-target
- inputText: ${NAME}
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-reference-amount-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-reference-amount-input-touch-target
- inputText: '100'
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-energy-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-energy-input-touch-target
- inputText: '89'
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-consumed-amount-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-consumed-amount-input-touch-target
- inputText: '100'
# The number pad exposes no dismiss action, so a short drag in the content area
# dismisses it through keyboardDismissMode="on-drag".
- swipe:
    start: 50%,55%
    end: 50%,10%
    duration: 500
# The Date and Time fields are left exactly as the form prefilled them. That
# prefill is the whole claim: nothing here types a date.
- tapOn: Save entry
- assertVisible: Add nutrition
- swipe:
    start: 1%,50%
    end: 95%,50%
    duration: 300
- assertVisible: Nutrition
