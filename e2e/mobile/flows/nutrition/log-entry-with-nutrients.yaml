appId: com.fitnessapp.dev
---
# Callers must pass CARBOHYDRATE, ENERGY, FAT, NAME, PROTEIN, and
# SHOULD_USE_PREVIOUS_DAY. This flow declares no env defaults because a default
# here would win over the value supplied by runFlow.
#
# Synthetic values only. Every nutrient is supplied, which is what makes the
# period's nutrient totals and averages complete rather than Incomplete.
- tapOn:
    id: tab-nutrition
- assertVisible: Nutrition
# The navigation controls are AppButtons, which are read by their accessible
# label rather than by the "Previous" and "Next" text they display. The diary
# records to the day it is showing, so moving first is what back-dates the
# entry.
- runFlow:
    when:
      true: ${SHOULD_USE_PREVIOUS_DAY == 'true'}
    commands:
      - tapOn: Previous day
- tapOn: Add food or beverage
- tapOn: Enter one-time item
- assertVisible: Add food or beverage
- tapOn:
    id: nutrition-description-input-touch-target
- inputText: ${NAME}
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-reference-amount-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-reference-amount-input-touch-target
- inputText: '100'
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-energy-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-energy-input-touch-target
- inputText: ${ENERGY}
# Each optional nutrient is centred before it is tapped, so the number pad
# never covers the field the next step is aiming at.
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-protein-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-protein-input-touch-target
- inputText: ${PROTEIN}
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-carbohydrate-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-carbohydrate-input-touch-target
- inputText: ${CARBOHYDRATE}
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-fat-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-fat-input-touch-target
- inputText: ${FAT}
- scrollUntilVisible:
    centerElement: true
    element:
      id: nutrition-consumed-amount-input-touch-target
    direction: DOWN
- tapOn:
    id: nutrition-consumed-amount-input-touch-target
- inputText: '100'
# The number pad exposes no dismiss action, so a short drag in the content area
# dismisses it through keyboardDismissMode="on-drag".
- swipe:
    start: 50%,55%
    end: 50%,10%
    duration: 500
# The Date and Time fields keep the day the diary was showing.
- tapOn: Save entry
- assertVisible: Add nutrition
- swipe:
    start: 1%,50%
    end: 95%,50%
    duration: 300
- assertVisible: Nutrition
