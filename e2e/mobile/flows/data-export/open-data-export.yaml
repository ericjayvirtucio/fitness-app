appId: com.fitnessapp.dev
---
# Export now lives inside Data controls with restore and deletion, so the flow
# goes through that screen rather than tapping a Profile action directly.
- runFlow: ../data-lifecycle/open-data-controls.yaml
- scrollUntilVisible:
    element:
      id: open-data-export
    direction: DOWN
- tapOn:
    id: open-data-export
- assertVisible:
    id: data-export-screen
