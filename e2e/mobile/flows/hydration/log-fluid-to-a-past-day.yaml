appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-today
- assertVisible: Hydration
- tapOn: Previous day
# A past day replaces the target card with one sentence, so this screen is
# SHORTER than today's and "Add fluid" lands inside the tab-bar clearance.
# Maestro judges visibility against the device rectangle, so it reports the
# control fully visible, scrolls zero times, and taps a point the tab bar
# covers. centerElement is what forces the scroll that today's flow gets for
# free from the taller target card above it.
- assertVisible: 'Historical days show recorded totals.*'
- scrollUntilVisible:
    centerElement: true
    element:
      text: Add fluid
    direction: DOWN
- tapOn: Add fluid
- tapOn: ${PRESET}
- scrollUntilVisible:
    element:
      text: Save fluid
    direction: DOWN
# The Date and Time fields are left exactly as the form prefilled them.
- tapOn: Save fluid
# Reaching the add control scrolled this screen, and it keeps that offset when
# the save returns to it, so the totals card above is scrolled back into view
# rather than assumed to be where it started.
- scrollUntilVisible:
    element:
      text: Hydration
    direction: UP
- assertVisible: Hydration
