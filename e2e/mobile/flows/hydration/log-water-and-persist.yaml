appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-today
- assertVisible: Hydration
- scrollUntilVisible:
    centerElement: true
    element:
      text: Set daily target
    direction: DOWN
- tapOn: Set daily target
- tapOn: Liters (L)
- tapOn:
    id: hydration-target-amount-input-touch-target
- inputText: '3'
- tapOn: Save daily target
- swipe:
    start: 50%,70%
    end: 50%,20%
    duration: 400
- swipe:
    start: 50%,70%
    end: 50%,20%
    duration: 400
- assertVisible: 'Fluid target progress, 0 mL of 3 L, 0%'
- scrollUntilVisible:
    element:
      text: Add fluid
    direction: DOWN
- tapOn: Add fluid
- tapOn: 500 mL
- scrollUntilVisible:
    element:
      text: Save fluid
    direction: DOWN
- tapOn: Save fluid
- assertVisible: 'Daily fluid totals, total 500 mL, plain water 500 mL, other fluids 0 mL, 1 entry'
- stopApp
- launchApp
- assertVisible: 'Daily fluid totals, total 500 mL, plain water 500 mL, other fluids 0 mL, 1 entry'
- swipe:
    start: 50%,70%
    end: 50%,20%
    duration: 400
- swipe:
    start: 50%,70%
    end: 50%,20%
    duration: 400
- assertVisible: 'Fluid target progress, 500 mL of 3 L, 17%'
