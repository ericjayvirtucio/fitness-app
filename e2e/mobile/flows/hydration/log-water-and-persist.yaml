appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-today
- assertVisible: Hydration
- tapOn: Set daily target
- tapOn: Liters (L)
- tapOn: Target (L)
- inputText: '3'
- tapOn: Save daily target
- assertVisible: 3 L remaining of 3 L
- scrollUntilVisible:
    element:
      text: Add fluid
    direction: DOWN
- tapOn: Add fluid
- tapOn: 500 mL
- scrollUntilVisible:
    element:
      text: Save fluid
    direction: DOWN
- tapOn: Save fluid
- assertVisible: 'Daily fluid totals, total 500 mL, plain water 500 mL, other fluids 0 mL, 1 entry'
- stopApp
- launchApp
- assertVisible: 'Daily fluid totals, total 500 mL, plain water 500 mL, other fluids 0 mL, 1 entry'
- assertVisible: 2.5 L remaining of 3 L
