appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
# "Create exercise" is the last control on the screen and the starter-exercise
# section now sits above it, so even the empty state can push it below the fold.
# This flow used to tap it directly, which is exactly the trap the harness
# documents: a flow that worked against a shorter screen is not evidence that it
# works against a taller one.
- scrollUntilVisible:
    element:
      text: Create exercise
    direction: DOWN
    centerElement: true
- tapOn: Create exercise
- tapOn:
    id: exercise-name-input
- inputText: E2E Push-up
# A short drag dismisses the keyboard, because the screen uses
# keyboardDismissMode="on-drag". Without it the keyboard covers the equipment
# options on a shorter device, the tap meant for Bodyweight lands on a keyboard
# key instead, and that character is appended to the name field that still has
# focus — which is how this flow once came to expect a trailing "a" in the
# saved name. That misspelling passed on one simulator and failed on a taller
# one; the drag removes the difference instead of encoding it.
- swipe:
    start: 50%, 45%
    end: 50%, 40%
- tapOn: Bodyweight
- tapOn: Chest
- scrollUntilVisible:
    element:
      text: Bodyweight + reps
    direction: DOWN
- tapOn: Bodyweight + reps
- scrollUntilVisible:
    element:
      text: Save exercise
    direction: DOWN
- tapOn: Save exercise
# Saving returns to a library this definition has just made non-empty, which is
# exactly when its filter controls appear between the starter section and the
# list. The screen is taller than it was a moment ago, so the new card starts
# below the fold: scroll to it rather than trusting a position that only held
# while the library was empty. This is the same lesson that moved this flow off
# tapping "Create exercise" where it used to sit.
- scrollUntilVisible:
    element:
      text: Edit E2E Push-up
    direction: DOWN
    centerElement: true
- assertVisible: Edit E2E Push-up
- tapOn: Add E2E Push-up to favorites
- stopApp
- launchApp
- runFlow:
    when:
      visible:
        id: tab-workout
    commands:
      - tapOn:
          id: tab-workout
      - scrollUntilVisible:
          element:
            text: Open Exercise Library
          direction: DOWN
      - tapOn: Open Exercise Library
- scrollUntilVisible:
    element:
      text: Edit E2E Push-up
    direction: DOWN
    centerElement: true
- assertVisible: Edit E2E Push-up
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: tab-workout
