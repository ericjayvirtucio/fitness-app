appId: com.fitnessapp.dev
---
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
- tapOn: Create exercise
- tapOn:
    id: exercise-name-input
- inputText: E2E Push-up
- tapOn: Bodyweight
- tapOn: Chest
- scrollUntilVisible:
    element:
      text: Bodyweight + reps
    direction: DOWN
- tapOn: Bodyweight + reps
- scrollUntilVisible:
    element:
      text: Save exercise
    direction: DOWN
- tapOn: Save exercise
- assertVisible: Edit E2E Push-upa
- tapOn: Add E2E Push-upa to favorites
- stopApp
- launchApp
- runFlow:
    when:
      visible:
        id: tab-workout
    commands:
      - tapOn:
          id: tab-workout
      - scrollUntilVisible:
          element:
            text: Open Exercise Library
          direction: DOWN
      - tapOn: Open Exercise Library
- assertVisible: Edit E2E Push-upa
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: tab-workout
