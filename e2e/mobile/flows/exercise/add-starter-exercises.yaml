appId: com.fitnessapp.dev
---
# Opens the Exercise Library and adds the starter exercises the way a person
# does: through the public library screen, with no fixture, no seeder, and no
# hidden route. The starter import is a product feature, so it is exercised as
# one; suites that need a definition of their own still author it.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
# The starter section sits above the catalog, directly under the search field,
# so it stays reachable however many definitions the library holds. It can still
# begin below the fold on a short device, so it is scrolled to rather than
# assumed.
- scrollUntilVisible:
    element:
      text: Add starter exercises
    direction: DOWN
    centerElement: true
- tapOn: Add starter exercises
# Ends on the Exercise Library, which is a pushed screen with no tab bar. A
# caller that needs the tabs relaunches rather than guessing at back gestures.
#
# Deliberately asserts nothing about the outcome. Each scenario asserts the
# sentence it expects, because one sentence here would be wrong for a second
# import.

