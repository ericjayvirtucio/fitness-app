appId: com.fitnessapp.dev
---
# Authors one bodyweight definition under a caller-chosen name, so a scenario
# can hold a name the starter set also uses and prove the import leaves it
# alone.
#
# EXERCISE_NAME is deliberately required rather than defaulted, because a flow's
# own `env` block is applied after the caller's `runFlow` env and overrides it.
#
# `create-exercise.yaml` stays hard-coded and unparameterised: forty-six suites
# compose it, and changing its contract to serve one scenario is a blast radius
# nothing here needs.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
# "Create exercise" is the last control on the screen, below the starter
# section, so it is scrolled to rather than assumed to be on screen.
- scrollUntilVisible:
    element:
      text: Create exercise
    direction: DOWN
    centerElement: true
- tapOn: Create exercise
- tapOn:
    id: exercise-name-input
- inputText: ${EXERCISE_NAME}
# A short drag dismisses the keyboard, because the screen uses
# keyboardDismissMode="on-drag". Without it the keyboard covers the equipment
# options on a shorter device and the tap lands on a keyboard key, which is then
# appended to the name field that still has focus.
- swipe:
    start: 50%, 45%
    end: 50%, 40%
- tapOn: Bodyweight
- tapOn: Chest
- scrollUntilVisible:
    element:
      text: Bodyweight + reps
    direction: DOWN
- tapOn: Bodyweight + reps
- scrollUntilVisible:
    element:
      text: Save exercise
    direction: DOWN
- tapOn: Save exercise
- scrollUntilVisible:
    element:
      text: Edit ${EXERCISE_NAME}
    direction: DOWN
    centerElement: true
