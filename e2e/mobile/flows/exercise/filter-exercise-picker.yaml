appId: com.fitnessapp.dev
---
# Narrows an already-open Exercise Picker through the same control the Exercise
# Library uses, in whichever of its three places a scenario met it: the Workout
# Planner, the active Workout Session, or a completed workout.
#
# EQUIPMENT_FILTER_ID and MUSCLE_FILTER_ID are deliberately required rather than
# defaulted, because a flow's own `env` block is applied after the caller's
# `runFlow` env and would silently override every value passed in. Pass
# `exercise-picker-equipment-filter-any` or `exercise-picker-muscle-filter-any`
# to leave one of them unnarrowed.
#
# The picker's identifiers carry their own `exercise-picker` prefix rather than
# the library's, so a step never has to say which of the two surfaces it meant —
# both can be reached in one run, and the picker is pushed over screens the
# library is not.
#
# Assumes a picker is open and the catalog is not empty; the control is absent
# while there is nothing to narrow. Asserts nothing about the result, because
# each scenario expects a different one.
- assertVisible:
    id: exercise-picker-search
- scrollUntilVisible:
    element:
      id: exercise-picker-search
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element:
      id: exercise-picker-filters-toggle
    direction: DOWN
    centerElement: true
# Opened only when they are not already open, so a scenario that filters twice
# does not close them on its second pass. The check is made with the toggle
# centred, the one viewport where the equipment group renders if it is open.
- runFlow:
    when:
      notVisible:
        id: exercise-picker-equipment-filter
    commands:
      - tapOn:
          id: exercise-picker-filters-toggle
- scrollUntilVisible:
    element:
      id: ${EQUIPMENT_FILTER_ID}
    direction: DOWN
    centerElement: true
- tapOn:
    id: ${EQUIPMENT_FILTER_ID}
- scrollUntilVisible:
    element:
      id: ${MUSCLE_FILTER_ID}
    direction: DOWN
    centerElement: true
- tapOn:
    id: ${MUSCLE_FILTER_ID}
