appId: com.fitnessapp.dev
---
# Authors one "Added weight + reps" definition through the public exercise
# editor, so a suite can record an added-load set beside an assisted one and
# prove the two are told apart. The domain restricts added load to bodyweight
# equipment, so that pairing is the one the product actually accepts.
#
# A separate flow from `create-exercise.yaml` rather than a parameter on it:
# that flow is composed by many scenarios and also favorites its definition and
# relaunches the app, neither of which this one needs.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
# "Create exercise" is the last control on the screen and every section above it
# moves it further down, so it is scrolled to rather than tapped where it sat.
- scrollUntilVisible:
    element:
      text: Create exercise
    direction: DOWN
    centerElement: true
- tapOn: Create exercise
- tapOn:
    id: exercise-name-input
- inputText: E2E Weighted Dip
# A short drag dismisses the keyboard, because the screen uses
# keyboardDismissMode="on-drag". Without it the keyboard covers the equipment
# options and the tap meant for one of them appends a character to the name
# field that still has focus.
- swipe:
    start: 50%, 45%
    end: 50%, 40%
- tapOn: Bodyweight
- tapOn: Chest
# "Added weight + reps" sits below "Bodyweight + reps" in the logging mode list,
# so the form is taller here than it is for the modes `create-exercise.yaml`
# picks.
- scrollUntilVisible:
    element:
      text: Added weight + reps
    direction: DOWN
- tapOn: Added weight + reps
- scrollUntilVisible:
    element:
      text: Save exercise
    direction: DOWN
- tapOn: Save exercise
# Saving returns to a library this definition may have just made non-empty,
# which is when its filter controls appear above the list. The screen is taller
# than it was a moment ago, so the new card starts below the fold.
- scrollUntilVisible:
    element:
      text: Edit E2E Weighted Dip
    direction: DOWN
    centerElement: true
- assertVisible: Edit E2E Weighted Dip
# Returns to the tab shell the same way `create-exercise.yaml` does, so a suite
# can compose a workout flow straight afterwards.
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: tab-workout
