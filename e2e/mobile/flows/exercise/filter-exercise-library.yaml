appId: com.fitnessapp.dev
---
# Narrows the Exercise Library through its own filter controls, the way a person
# does. The caller passes the two option identifiers, so one flow serves every
# equipment and muscle-group combination a scenario needs.
#
# EQUIPMENT_FILTER_ID and MUSCLE_FILTER_ID are deliberately required rather than
# defaulted: a flow's own `env` block is applied after the caller's `runFlow` env
# and would silently override every value passed in. Pass
# `exercise-library-equipment-filter-any` or
# `exercise-library-muscle-filter-any` to leave one of them unnarrowed.
#
# Options are tapped by identifier rather than by their visible text, because the
# exercise editor labels its equipment and muscle choices with the same words and
# a text selector would stop saying which screen it meant.
#
# The controls sit below the starter section and directly above the lists they
# narrow. A caller can arrive above them, having just imported, or below them,
# having just read the summary of an earlier filter — and `scrollUntilVisible`
# only searches the direction it is given, so a single downward pass finds
# nothing when the control is already overhead. The starter offer is always above
# it, so anchoring on it first makes the following downward scroll correct from
# either side.
#
# Assumes the library is already open and holds at least one definition; the
# control is absent while it is empty. Ends on the Exercise Library, a pushed
# screen with no tab bar, so a caller that needs the tabs relaunches.
- assertVisible: Exercise Library
- scrollUntilVisible:
    element:
      text: Add starter exercises
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element:
      id: exercise-library-filters-toggle
    direction: DOWN
    centerElement: true
# The options are put away by default, so they are opened before one can be
# tapped — and only when they are not already open, because a scenario that
# filters twice would otherwise close them on its second pass. The check is made
# with the toggle centred, which is the one viewport where the equipment group
# renders if it is open: off-screen content is absent from the hierarchy rather
# than hidden, so asking this question from anywhere else would answer it wrong.
- runFlow:
    when:
      notVisible:
        id: exercise-library-equipment-filter
    commands:
      - tapOn:
          id: exercise-library-filters-toggle
- scrollUntilVisible:
    element:
      id: ${EQUIPMENT_FILTER_ID}
    direction: DOWN
    centerElement: true
- tapOn:
    id: ${EQUIPMENT_FILTER_ID}
- scrollUntilVisible:
    element:
      id: ${MUSCLE_FILTER_ID}
    direction: DOWN
    centerElement: true
- tapOn:
    id: ${MUSCLE_FILTER_ID}
# Deliberately asserts nothing about the result. Each scenario asserts the list
# and the summary sentence it expects, because one assertion here would be wrong
# for a combination that matches nothing.
