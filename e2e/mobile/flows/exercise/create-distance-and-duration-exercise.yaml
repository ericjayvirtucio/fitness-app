appId: com.fitnessapp.dev
---
# Authors one "Distance + duration" definition through the public exercise
# editor, so a suite can record both dimensions in one set and prove the
# Progress Workouts card states each of them.
#
# One definition rather than a "Distance" one and a "Duration" one: the domain
# restricts this mode to no equipment, a cardio machine, or other
# (`exercise-definition.ts`), and a single set under it produces a period
# holding a performed distance and a performed duration at once. Two
# single-dimension flows would cost two exercises and two workouts to prove the
# same two lines.
#
# A separate flow from `create-exercise.yaml` for the reason
# `create-added-load-exercise.yaml` gives: that flow is composed by many
# scenarios and also favorites its definition and relaunches the app, neither of
# which this one needs.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
# "Create exercise" is the last control on the screen and every section above it
# moves it further down, so it is scrolled to rather than tapped where it sat.
- scrollUntilVisible:
    element:
      text: Create exercise
    direction: DOWN
    centerElement: true
- tapOn: Create exercise
- tapOn:
    id: exercise-name-input
- inputText: E2E Row
# A short drag dismisses the keyboard, because the screen uses
# keyboardDismissMode="on-drag". Without it the keyboard covers the equipment
# options and the tap meant for one of them appends a character to the name
# field that still has focus.
- swipe:
    start: 50%, 45%
    end: 50%, 40%
- tapOn: Cardio machine
- tapOn: Conditioning
# "Distance + duration" is the last option in the logging mode list, so the form
# is taller here than it is for any mode the other creation flows pick.
- scrollUntilVisible:
    element:
      text: Distance + duration
    direction: DOWN
- tapOn: Distance + duration
- scrollUntilVisible:
    element:
      text: Save exercise
    direction: DOWN
- tapOn: Save exercise
# Saving returns to a library this definition may have just made non-empty,
# which is when its filter controls appear above the list. The screen is taller
# than it was a moment ago, so the new card starts below the fold.
- scrollUntilVisible:
    element:
      text: Edit E2E Row
    direction: DOWN
    centerElement: true
- assertVisible: Edit E2E Row
# Returns to the tab shell the same way `create-exercise.yaml` does, so a suite
# can compose a workout flow straight afterwards.
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 500
- assertVisible:
    id: tab-workout
