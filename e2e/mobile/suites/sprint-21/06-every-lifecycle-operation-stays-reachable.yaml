appId: com.fitnessapp.dev
name: Reach export, restore, replacement, and deletion separately
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/data-lifecycle/open-data-controls.yaml
# Each operation keeps its own named control. Nothing here infers which one the
# user meant, and adding replacement did not fold the other three together.
#
# The four actions no longer fit one viewport below the summary card, and they
# fit even less under large Dynamic Type, so each one is scrolled to before it
# is asserted. Asserting all four from a single scroll position would encode the
# current screen height as the expected result and would break on a shorter
# device or a larger text size.
- scrollUntilVisible:
    element:
      id: open-data-export
    direction: DOWN
    centerElement: true
- assertVisible:
    id: open-data-export
- scrollUntilVisible:
    element:
      id: open-data-restore
    direction: DOWN
    centerElement: true
- assertVisible:
    id: open-data-restore
- scrollUntilVisible:
    element:
      id: open-replace-local-data
    direction: DOWN
    centerElement: true
- assertVisible:
    id: open-replace-local-data
- scrollUntilVisible:
    element:
      id: open-delete-local-data
    direction: DOWN
    centerElement: true
- assertVisible:
    id: open-delete-local-data
