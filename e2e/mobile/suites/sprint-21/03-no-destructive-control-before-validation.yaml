appId: com.fitnessapp.dev
name: Offer no destructive control before a file is validated
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/data-lifecycle/open-replace-local-data.yaml
# Validation is what makes replacement safe, so nothing that could replace data
# exists on screen until a file has been read and checked. The picker itself is
# owned by the operating system, so no flow opens it or asserts inside it.
- scrollUntilVisible:
    element:
      id: choose-replace-local-data-file
    direction: DOWN
- assertVisible:
    id: choose-replace-local-data-file
- assertNotVisible:
    id: confirm-replace-local-data
- assertNotVisible:
    id: acknowledge-replace-local-data
- assertNotVisible:
    id: replace-local-data-preview
