appId: com.fitnessapp.dev
name: Leave replacement without selecting a file
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/hydration/log-water-and-persist.yaml
- runFlow: ../../flows/data-lifecycle/open-replace-local-data.yaml
- assertVisible:
    id: replace-local-data-screen
# Replacement is a stack route without a tab bar, so the app returns to the tab
# shell with a fresh launch rather than a back gesture. Relaunching without
# clearing state also proves that opening the screen changed nothing.
- stopApp
- launchApp
- runFlow: ../../flows/shared/assert-primary-navigation.yaml
- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-height
