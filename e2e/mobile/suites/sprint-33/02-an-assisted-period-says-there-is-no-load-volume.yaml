appId: com.fitnessapp.dev
name: A period holding only assisted work says there is no recorded load volume
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-assisted-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-assisted-workout.yaml
    env:
      ASSISTANCE: '20'
      REPETITIONS: '8'
- runFlow: ../../flows/workout/open-workout-history.yaml
- assertVisible: 'Workout progress summary,.*No recorded load volume from weighted sets'
# The absence is a sentence, never a zero. Both assertions read the same card
# name from the same viewport, so the negative one is made where the number
# would render if the absence had been filled in instead of stated.
- assertNotVisible: 'Workout progress summary,.*kg-reps.*'
