appId: com.fitnessapp.dev
name: A period mixing weighted and assisted work states the eligible total and its coverage
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-assisted-exercise.yaml
- runFlow: ../../flows/exercise/create-added-load-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-assisted-workout.yaml
    env:
      ASSISTANCE: '20'
      REPETITIONS: '8'
- runFlow:
    file: ../../flows/workout/complete-added-load-workout.yaml
    env:
      ADDED_WEIGHT: '20'
      REPETITIONS: '8'
- runFlow: ../../flows/workout/open-workout-history.yaml
# Twenty kilograms under each of the two modes. Repetitions counts both sets,
# because it is a total over everything of its own dimension; recorded load
# volume counts one of them, and is the reason the sentence says which.
- assertVisible: 'Workout progress summary,.*2 actual sets,.*16 repetitions, 160 kg-reps recorded load volume from weighted sets'
