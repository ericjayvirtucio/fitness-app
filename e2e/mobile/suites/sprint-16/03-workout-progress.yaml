appId: com.fitnessapp.dev
name: Completed actual workout appears in progress
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow: ../../flows/workout/complete-and-review-history.yaml
- stopApp
- launchApp
- tapOn:
    id: tab-progress
- scrollUntilVisible:
    element:
      text: Completed workouts, 1
    direction: DOWN
- assertVisible: Completed workouts, 1
- scrollUntilVisible:
    element:
      text: Actual sets, 1
    direction: DOWN
- scrollUntilVisible:
    element:
      text: Repetitions, 12
    direction: DOWN
