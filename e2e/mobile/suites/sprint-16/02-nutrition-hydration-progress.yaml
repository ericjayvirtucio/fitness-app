appId: com.fitnessapp.dev
name: Recorded nutrition and hydration appear in progress
---
- launchApp:
    clearState: true
- runFlow: ../../flows/nutrition/log-one-time-entry.yaml
- runFlow: ../../flows/hydration/log-water-and-persist.yaml
- tapOn:
    id: tab-progress
- assertVisible: 'Energy, 89 kcal'
# The completeness sentence sits at the bottom of the Nutrition card, which
# gained three average lines above it, so it is no longer in the first viewport.
- scrollUntilVisible:
    centerElement: true
    element:
      text: Incomplete means one or more entries did not include that nutrient.
    direction: DOWN
- assertVisible: Incomplete means one or more entries did not include that nutrient.
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Total fluid, 500 mL'
    direction: DOWN
- assertVisible: 'Total fluid, 500 mL'
- assertNotVisible: target met
