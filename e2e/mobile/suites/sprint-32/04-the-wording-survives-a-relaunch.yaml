appId: com.fitnessapp.dev
name: A recorded set is worded from its stored snapshot after a relaunch
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-assisted-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-assisted-workout.yaml
    env:
      ASSISTANCE: '20'
      REPETITIONS: '8'
- stopApp
- launchApp
# Nothing about the meaning is stored on the set row, so this proves the
# sentence is composed again from the captured logging mode rather than held in
# memory from the session that recorded it.
- runFlow: ../../flows/workout/open-completed-workout.yaml
- assertVisible: 'Performed set 1: Assistance 20 kg × 8'
