appId: com.fitnessapp.dev
name: A recorded assisted set says assistance in the session and in history
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-assisted-exercise.yaml
# The flow asserts the active session's own sentence before finishing, so this
# scenario proves the same wording twice: once while the set is being recorded,
# and once in completed history.
- runFlow:
    file: ../../flows/workout/complete-assisted-workout.yaml
    env:
      ASSISTANCE: '20'
      REPETITIONS: '8'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- assertVisible: 'Performed set 1: Assistance 20 kg × 8'
