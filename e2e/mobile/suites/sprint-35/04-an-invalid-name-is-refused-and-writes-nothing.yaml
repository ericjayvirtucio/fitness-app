appId: com.fitnessapp.dev
name: An invalid name is refused in one sentence and writes nothing
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- scrollUntilVisible:
    element:
      id: rename-completed-workout
    direction: DOWN
    centerElement: true
- tapOn:
    id: rename-completed-workout
- assertVisible: Rename workout
- tapOn:
    id: workout-name-touch-target
- eraseText
# Nothing is typed back, so the workout is asked to accept an empty name. The
# text keyboard covers the save control; a short drag dismisses it because the
# screen sets keyboardDismissMode="on-drag".
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Save Name
    direction: DOWN
    centerElement: true
- tapOn: Save Name
# One fixed sentence, naming no workout, no column, and no identifier.
- assertVisible: Enter a workout name of 1 to 80 characters.
- assertVisible: Rename workout
- scrollUntilVisible:
    element:
      text: Cancel
    direction: DOWN
    centerElement: true
- tapOn: Cancel
# Nothing was written. The workout is still called what it was called.
- assertVisible:
    id: completed-workout-screen
- assertVisible: Workout
- assertVisible: 'Performed set 1: 12 reps'
