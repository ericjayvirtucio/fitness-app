appId: com.fitnessapp.dev
name: A rename changes what a personal record says its evidence is called
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-exercise-personal-records.yaml
# What a record cites before anyone names anything: a workout called nothing in
# particular.
- assertVisible: 'Most recorded repetitions in a set, 12 repetitions, first recorded on .*, in Workout, set 1'
- stopApp
- launchApp
- runFlow: ../../flows/workout/open-completed-workout.yaml
- runFlow:
    file: ../../flows/workout/rename-workout.yaml
    env:
      RENAME_CONTROL: rename-completed-workout
      NEW_NAME: E2E Leg Day
- assertVisible:
    id: completed-workout-screen
- stopApp
- launchApp
- runFlow: ../../flows/workout/open-exercise-personal-records.yaml
# The claim this scenario exists for. Both readers project display_name through a
# live join rather than reading a stored snapshot, so the record set before the
# rename now cites the name the workout has. Its value and its set number are
# unchanged, which is what the rest of the sentence proves.
- assertVisible: 'Most recorded repetitions in a set, 12 repetitions, first recorded on .*, in E2E Leg Day, set 1'
- assertNotVisible: 'Most recorded repetitions in a set, 12 repetitions, first recorded on .*, in Workout, set 1'
# The occurrence card beneath it agrees, and still reports what was performed.
- scrollUntilVisible:
    element:
      text: 'Open E2E Leg Day,.*12 repetitions'
    direction: DOWN
    centerElement: true
