appId: com.fitnessapp.dev
name: Deletion survives a relaunch
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/hydration/log-water-and-persist.yaml
- runFlow: ../../flows/data-lifecycle/delete-all-local-data.yaml
# Relaunching without clearing state proves the records were removed from
# storage rather than from a screen.
- stopApp
- launchApp
- runFlow: ../../flows/shared/assert-primary-navigation.yaml
- scrollUntilVisible:
    element:
      text: Nothing logged for this day
    direction: DOWN
- assertVisible: Nothing logged for this day
# The daily target the suite set is user-owned configuration, so it is gone too
# rather than surviving as a default.
- assertVisible: No daily target set
- tapOn:
    id: tab-profile
- assertVisible: Set up your profile
