appId: com.fitnessapp.dev
name: Review what deletion removes and what it leaves alone
---
- launchApp:
    clearState: true
- runFlow: ../../flows/data-lifecycle/open-data-controls.yaml
- scrollUntilVisible:
    element:
      id: open-delete-local-data
    direction: DOWN
- tapOn:
    id: open-delete-local-data
- assertVisible:
    id: delete-local-data-screen
- scrollUntilVisible:
    element:
      id: delete-local-data-removed
    direction: DOWN
- assertVisible: '.*Completed workouts, including every logged set.*'
- scrollUntilVisible:
    element:
      id: delete-local-data-kept
    direction: DOWN
- assertVisible: '.*Export files you already saved somewhere else.*'
- assertVisible: '.*This app has no account and stores nothing online.*'
