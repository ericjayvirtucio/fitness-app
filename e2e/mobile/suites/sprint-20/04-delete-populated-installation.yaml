appId: com.fitnessapp.dev
name: Delete a populated installation
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/hydration/log-water-and-persist.yaml
- runFlow: ../../flows/data-lifecycle/delete-all-local-data.yaml
- assertVisible: Everything on this device was deleted
- assertNotVisible:
    id: delete-local-data-cleanup-warning
