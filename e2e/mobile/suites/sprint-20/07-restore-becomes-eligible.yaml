appId: com.fitnessapp.dev
name: Restoring becomes eligible after deletion
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
# Restore refuses while the installation holds information.
- runFlow: ../../flows/data-restore/open-data-restore.yaml
- scrollUntilVisible:
    element:
      id: data-restore-blocked
    direction: DOWN
- assertVisible: This app already has information
- stopApp
- launchApp
- runFlow: ../../flows/data-lifecycle/delete-all-local-data.yaml
- tapOn:
    id: finish-delete-local-data
# Nothing opens the picker on its own: the user has to choose restoring.
- runFlow: ../../flows/data-restore/open-data-restore.yaml
- scrollUntilVisible:
    element:
      id: choose-data-restore-file
    direction: DOWN
- assertVisible:
    id: choose-data-restore-file
- assertNotVisible:
    id: data-restore-blocked
