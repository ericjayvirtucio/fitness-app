appId: com.fitnessapp.dev
name: Cancelling the confirmation keeps the completed workout
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- scrollUntilVisible:
    element:
      id: delete-completed-workout
    direction: DOWN
- tapOn:
    id: delete-completed-workout
- assertVisible: 'Delete Workout.*'
- assertVisible: '.*cannot be recovered.*'
- tapOn: Cancel
- assertVisible:
    id: completed-workout-screen
- assertVisible: 'Performed set 1: 12 reps'
- stopApp
- launchApp
- runFlow: ../../flows/workout/open-completed-workout.yaml
- assertVisible: 'Performed set 1: 12 reps'
