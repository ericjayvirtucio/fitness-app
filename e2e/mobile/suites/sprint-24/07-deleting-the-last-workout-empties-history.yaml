appId: com.fitnessapp.dev
name: Deleting the last completed workout leaves an empty history
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- runFlow:
    file: ../../flows/workout/delete-completed-workout.yaml
    env:
      WORKOUT_NAME: Workout
# The empty state sits below the summary and the period controls, so it is off
# screen until history is scrolled. The summary's own "0 completed workouts"
# line is not assertable: that card carries an accessibilityLabel, so its lines
# never reach the accessibility tree Maestro reads, and only the card's own name
# can be matched. Progress states the count as plain text instead.
- scrollUntilVisible:
    element:
      text: No completed workouts yet
    direction: DOWN
- assertVisible: No completed workouts yet
- assertNotVisible:
    id: completed-workout-card
- stopApp
- launchApp
- tapOn:
    id: tab-progress
- assertVisible: No completed workouts in this period.
# The exercise itself is untouched; only the workout that performed it is gone.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
# A populated library carries its filter controls between the starter section and
# the list, so the card sits below the fold on arrival.
- scrollUntilVisible:
    element:
      text: Edit E2E Push-up
    direction: DOWN
    centerElement: true
- assertVisible: Edit E2E Push-up
