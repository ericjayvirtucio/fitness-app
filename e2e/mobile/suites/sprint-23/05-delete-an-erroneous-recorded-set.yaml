appId: com.fitnessapp.dev
name: An erroneous recorded set is deleted after an explicit confirmation
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- scrollUntilVisible:
    element:
      text: Add missing set for E2E Push-up
    direction: DOWN
- tapOn: Add missing set for E2E Push-up
- tapOn:
    id: workout-set-repetitions-input
- inputText: '99'
- scrollUntilVisible:
    element:
      text: Save Missing Set
    direction: DOWN
- tapOn: Save Missing Set
- assertVisible: 'Performed set 2: 99 reps'
- scrollUntilVisible:
    element:
      text: Delete recorded set 2 for E2E Push-up
    direction: DOWN
- tapOn: Delete recorded set 2 for E2E Push-up
- assertVisible: Delete this recorded set?
- tapOn: Delete Recorded Set
- assertNotVisible: 'Performed set 2: 99 reps'
- assertVisible: 'Performed set 1: 12 reps'
- assertVisible: 1 actual sets
