appId: com.fitnessapp.dev
name: A period states its recorded load volume and what that total counts
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-added-load-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-added-load-workout.yaml
    env:
      ADDED_WEIGHT: '20'
      REPETITIONS: '8'
- tapOn:
    id: tab-progress
# Twenty kilograms across eight repetitions, the same fixture Sprint 33 proved
# on Workout History. There the sentence sits inside a card carrying an
# accessibilityLabel, so it can only be matched as a fragment of the card's own
# name. The Progress summary cards deliberately carry no label, so this is the
# first surface where the sentence is assertable as itself.
- scrollUntilVisible:
    centerElement: true
    element:
      text: 160 kg-reps recorded load volume from weighted sets
    direction: DOWN
- assertVisible: 160 kg-reps recorded load volume from weighted sets
# The coverage travels in the sentence carrying the number, so the number never
# appears on its own.
- assertNotVisible: 'Recorded load volume,.*'
# Repetitions counts every mode that records them, so this period states both
# dimensions of the one set it holds.
- assertVisible: Repetitions, 8
