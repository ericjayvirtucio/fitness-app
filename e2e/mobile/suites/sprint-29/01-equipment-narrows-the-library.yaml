appId: com.fitnessapp.dev
name: Filtering by equipment narrows the library
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- runFlow:
    file: ../../flows/exercise/filter-exercise-library.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-library-equipment-filter-dumbbell
      MUSCLE_FILTER_ID: exercise-library-muscle-filter-any
# The summary sits with the controls, between the starter section and the list.
# Its count is the assertion that proves narrowing: the definitions it excluded
# are off screen, and off-screen content is absent from the hierarchy rather than
# assertably hidden.
- scrollUntilVisible:
    element:
      id: exercise-library-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Dumbbell. 3 exercises.
- scrollUntilVisible:
    element:
      text: Filtered exercises
    direction: DOWN
    centerElement: true
- assertVisible: Filtered exercises
- scrollUntilVisible:
    element:
      text: Edit Dumbbell Biceps Curl
    direction: DOWN
    centerElement: true
- assertVisible: Edit Dumbbell Biceps Curl
