appId: com.fitnessapp.dev
name: Clearing the filters restores the whole library
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- runFlow:
    file: ../../flows/exercise/filter-exercise-library.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-library-equipment-filter-dumbbell
      MUSCLE_FILTER_ID: exercise-library-muscle-filter-chest
- scrollUntilVisible:
    element:
      id: exercise-library-filter-summary
    direction: UP
    centerElement: true
- assertVisible: Filtered by Dumbbell and Chest. No exercises match these filters.
# One action clears both criteria. The control is an AppButton, so it is reached
# by its accessible label rather than by position.
- scrollUntilVisible:
    element:
      text: Clear filters
    direction: DOWN
    centerElement: true
- tapOn: Clear filters
# "All exercises" is the heading the library uses only when nothing narrows it,
# so its return is the proof that both criteria were cleared.
- scrollUntilVisible:
    element:
      text: All exercises
    direction: DOWN
    centerElement: true
- assertVisible: All exercises
# The restored catalog is far taller than one viewport, so a definition the
# filter had excluded is reached through the library's own search rather than by
# scrolling to it.
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-search
- inputText: Burpee
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Burpee
    direction: DOWN
    centerElement: true
- assertVisible: Edit Burpee
