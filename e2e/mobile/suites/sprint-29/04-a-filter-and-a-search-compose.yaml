appId: com.fitnessapp.dev
name: A filter and a search narrow together
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- runFlow:
    file: ../../flows/exercise/filter-exercise-library.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-library-equipment-filter-barbell
      MUSCLE_FILTER_ID: exercise-library-muscle-filter-any
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-search
- inputText: Press
# A short drag dismisses the keyboard, because the screen uses
# keyboardDismissMode="on-drag". Without it the keyboard covers the controls
# below and a tap lands on a key, appending a character to the field that still
# has focus.
- swipe:
    start: 50%, 40%
    end: 50%, 35%
# Five barbell definitions, of which two are presses: the search and the filter
# both apply, and the section reports itself as search results.
- scrollUntilVisible:
    element:
      id: exercise-library-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Barbell. 2 exercises.
- scrollUntilVisible:
    element:
      text: Search results
    direction: DOWN
    centerElement: true
- assertVisible: Search results
- scrollUntilVisible:
    element:
      text: Edit Barbell Overhead Press
    direction: DOWN
    centerElement: true
- assertVisible: Edit Barbell Overhead Press
