appId: com.fitnessapp.dev
name: Filters belong to the screen and do not survive a relaunch
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- runFlow:
    file: ../../flows/exercise/filter-exercise-library.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-library-equipment-filter-dumbbell
      MUSCLE_FILTER_ID: exercise-library-muscle-filter-any
- scrollUntilVisible:
    element:
      id: exercise-library-filter-summary
    direction: UP
    centerElement: true
- assertVisible: Filtered by Dumbbell. 3 exercises.
# Nothing about a filter is stored, so a relaunch returns the whole catalog. The
# app is stopped and started without clearing state, which leaves the twenty-six
# imported definitions in place.
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
# "All exercises" is the heading the library uses only when nothing narrows it,
# and the summary line exists only while something does.
- scrollUntilVisible:
    element:
      text: All exercises
    direction: DOWN
    centerElement: true
- assertVisible: All exercises
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- assertNotVisible:
    id: exercise-library-filter-summary
# The import survived the relaunch too, reached through the library's own search
# because a twenty-six item catalog is far taller than one viewport.
- tapOn:
    id: exercise-library-search
- inputText: Burpee
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Burpee
    direction: DOWN
    centerElement: true
- assertVisible: Edit Burpee
