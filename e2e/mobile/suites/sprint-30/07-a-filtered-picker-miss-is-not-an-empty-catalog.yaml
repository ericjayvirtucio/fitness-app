appId: com.fitnessapp.dev
name: A picker filter that matches nothing never claims the catalog is empty
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- tapOn: Start Empty Workout
- assertVisible: Workout
- tapOn: Add Exercise
# No starter definition is both a dumbbell movement and a chest movement.
- runFlow:
    file: ../../flows/exercise/filter-exercise-picker.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-picker-equipment-filter-dumbbell
      MUSCLE_FILTER_ID: exercise-picker-muscle-filter-chest
- scrollUntilVisible:
    element:
      id: exercise-picker-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Dumbbell and Chest. No exercises match these filters.
# The picker's empty state renders immediately below the control, which is the
# viewport this assertion is made from. It would be untrue here: the catalog
# holds twenty-six definitions and one filter too many.
- assertNotVisible: No exercises found
- assertNotVisible: Create exercises in the Exercise Library before adding them to a plan.
