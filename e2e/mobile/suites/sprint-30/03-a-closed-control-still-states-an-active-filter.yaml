appId: com.fitnessapp.dev
name: Putting the options away never puts away an active filter
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- runFlow:
    file: ../../flows/exercise/filter-exercise-library.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-library-equipment-filter-dumbbell
      MUSCLE_FILTER_ID: exercise-library-muscle-filter-any
- scrollUntilVisible:
    element:
      id: exercise-library-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Dumbbell. 3 exercises.
# Close the options again. The summary and the clear action are rendered outside
# the region that closes, so both must survive it.
- scrollUntilVisible:
    element:
      id: exercise-library-filters-toggle
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-filters-toggle
- assertVisible: Show filters. Filtered by Dumbbell. 3 exercises.
- assertNotVisible:
    id: exercise-library-equipment-filter
- scrollUntilVisible:
    element:
      id: exercise-library-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Dumbbell. 3 exercises.
- assertVisible: Clear filters
# The narrowed catalog is still the one the summary describes.
- scrollUntilVisible:
    element:
      text: Edit Dumbbell Biceps Curl
    direction: DOWN
    centerElement: true
- assertVisible: Edit Dumbbell Biceps Curl
