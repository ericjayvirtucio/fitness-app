appId: com.fitnessapp.dev
name: The active Workout Session picker narrows the catalog
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- tapOn: Start Empty Workout
- assertVisible: Workout
- tapOn: Add Exercise
- runFlow:
    file: ../../flows/exercise/filter-exercise-picker.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-picker-equipment-filter-dumbbell
      MUSCLE_FILTER_ID: exercise-picker-muscle-filter-any
# No workout has been completed, so the picker was showing the whole catalog
# rather than recents; narrowing it leaves the three dumbbell definitions.
- scrollUntilVisible:
    element:
      id: exercise-picker-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Dumbbell. 3 exercises.
- scrollUntilVisible:
    element:
      text: Add Dumbbell Biceps Curl
    direction: DOWN
    centerElement: true
- assertVisible: Add Dumbbell Biceps Curl
