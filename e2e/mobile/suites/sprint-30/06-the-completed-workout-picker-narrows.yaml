appId: com.fitnessapp.dev
name: The completed workout addition picker narrows the catalog
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- stopApp
- launchApp
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- stopApp
- launchApp
- runFlow: ../../flows/workout/open-completed-workout.yaml
- scrollUntilVisible:
    element:
      id: add-completed-workout-exercise
    direction: DOWN
    centerElement: true
- tapOn:
    id: add-completed-workout-exercise
- assertVisible: Choose the exercise you performed
# This picker never falls back to the whole catalog, because an addition always
# happens after a workout has been completed and recents are never empty here.
# A filter reaches past those recents without typing a name, which is the one
# thing this screen could not do before.
- runFlow:
    file: ../../flows/exercise/filter-exercise-picker.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-picker-equipment-filter-barbell
      MUSCLE_FILTER_ID: exercise-picker-muscle-filter-chest
- scrollUntilVisible:
    element:
      id: exercise-picker-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Barbell and Chest. 1 exercise.
- scrollUntilVisible:
    element:
      text: Add Barbell Bench Press
    direction: DOWN
    centerElement: true
- assertVisible: Add Barbell Bench Press
