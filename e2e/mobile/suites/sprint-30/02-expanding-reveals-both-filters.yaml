appId: com.fitnessapp.dev
name: Opening the control reveals both filters
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- scrollUntilVisible:
    element:
      text: Add starter exercises
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element:
      id: exercise-library-filters-toggle
    direction: DOWN
    centerElement: true
- tapOn:
    id: exercise-library-filters-toggle
# The label states the act pressing now performs, which is the closing one.
- assertVisible: Hide filters. No filters applied.
- assertVisible:
    id: exercise-library-equipment-filter
- assertVisible: Filter by equipment
- scrollUntilVisible:
    element:
      id: exercise-library-muscle-filter
    direction: DOWN
    centerElement: true
- assertVisible: Filter by muscle group
