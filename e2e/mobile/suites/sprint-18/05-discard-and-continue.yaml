appId: com.fitnessapp.dev
name: Discard an export and keep using the app
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/data-export/open-data-export.yaml
- runFlow: ../../flows/data-export/create-data-export.yaml
- tapOn:
    id: discard-data-export
- assertNotVisible:
    id: data-export-ready
- assertVisible:
    id: create-data-export
- runFlow: ../../flows/shared/assert-primary-navigation.yaml
