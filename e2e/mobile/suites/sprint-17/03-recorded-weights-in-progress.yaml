appId: com.fitnessapp.dev
name: Recorded weights contribute to Progress
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/body-measurement/open-body-measurements.yaml
- runFlow:
    file: ../../flows/body-measurement/log-weight-check-in.yaml
    env:
      CHECK_IN_TIME: '00:01'
      SHOULD_SET_TIME: 'true'
      UPDATE_PROFILE: 'yes'
      WEIGHT: '83.0'
- runFlow:
    file: ../../flows/body-measurement/log-weight-check-in.yaml
    env:
      CHECK_IN_TIME: '00:01'
      SHOULD_SET_TIME: 'false'
      UPDATE_PROFILE: 'yes'
      WEIGHT: '81.8'
- assertVisible: 'Weight check-in 81.8 kilograms.*'
- assertVisible: 'Weight check-in 83.0 kilograms.*'
# Body measurements is a stack route, so the tab bar returns after a relaunch.
- stopApp
- launchApp
- tapOn:
    id: tab-progress
# Body weight is the last card on the Progress screen.
- scrollUntilVisible:
    element:
      id: progress-body-weight
    direction: DOWN
- assertVisible: 'First recorded, 83.0 kg'
- assertVisible: 'Latest recorded, 81.8 kg'
- assertVisible: 'Check-ins, 2'
# The period control sits above the body weight card.
- scrollUntilVisible:
    element:
      id: progress-period-month
    direction: UP
- tapOn:
    id: progress-period-month
- scrollUntilVisible:
    element:
      id: progress-body-weight
    direction: DOWN
- assertVisible: 'First recorded, 83.0 kg'
- assertVisible: 'Latest recorded, 81.8 kg'
# The newest check-in also updated the single current profile weight.
- tapOn:
    id: tab-profile
- assertVisible: '81.8'
