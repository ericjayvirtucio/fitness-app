appId: com.fitnessapp.dev
name: A period counts every nutrient it was given
---
# One entry supplying all six nutrients, so every total is exact and — with one
# logged day — every average equals its total. The denominator itself is pinned
# by the use case tests rather than here, because a fixture spanning two days
# would fall outside the selected week whenever the run happened on a Sunday.
- launchApp:
    clearState: true
- runFlow:
    file: ../../flows/nutrition/log-entry-with-nutrients.yaml
    env:
      CARBOHYDRATE: '40'
      ENERGY: '100'
      FAT: '12'
      FIBER: '6'
      NAME: E2E Six Nutrient Meal
      PROTEIN: '30'
      SODIUM: '450'
      SUGAR: '9'
- tapOn:
    id: tab-progress
# Every Progress metric is its own accessible element announcing "label, value",
# so each line is asserted by its whole name and neither of its two texts can be
# asserted on its own. A nutrient's average renders directly beneath its total,
# so centring the total brings the average into the same viewport.
- assertVisible: 'Energy, 100 kcal'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Protein, 30 g'
    direction: DOWN
- assertVisible: 'Average protein per logged day, 30 g'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Carbohydrate, 40 g'
    direction: DOWN
- assertVisible: 'Average carbohydrate per logged day, 40 g'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Fat, 12 g'
    direction: DOWN
- assertVisible: 'Average fat per logged day, 12 g'
# The three the period could not state before this sprint.
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Fiber, 6 g'
    direction: DOWN
- assertVisible: 'Average fiber per logged day, 6 g'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Sugar, 9 g'
    direction: DOWN
- assertVisible: 'Average sugar per logged day, 9 g'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Sodium, 450 mg'
    direction: DOWN
- assertVisible: 'Average sodium per logged day, 450 mg'
# The sodium average is the last line before the completeness sentence, so this
# is the viewport where the sentence would render if any nutrient were unknown.
# Every nutrient was supplied, so it does not.
- assertNotVisible: Incomplete means one or more entries did not include that nutrient.
