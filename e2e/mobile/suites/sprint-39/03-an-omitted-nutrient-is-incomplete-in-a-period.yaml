appId: com.fitnessapp.dev
name: An omitted nutrient is incomplete in a period rather than absent
---
# The one-time entry flow supplies energy and no optional nutrient, so all six
# nutrients are unknown. Before this sprint fiber, sugar, and sodium rendered
# nothing at all, which reads as an application that does not track them; they
# now say Incomplete for the same reason and in the same words the three
# macronutrients already did.
- launchApp:
    clearState: true
- runFlow: ../../flows/nutrition/log-one-time-entry.yaml
- tapOn:
    id: tab-progress
- assertVisible: 'Energy, 89 kcal'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Fiber, Incomplete'
    direction: DOWN
- assertVisible: 'Average fiber per logged day, Incomplete'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Sugar, Incomplete'
    direction: DOWN
- assertVisible: 'Average sugar per logged day, Incomplete'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Sodium, Incomplete'
    direction: DOWN
- assertVisible: 'Average sodium per logged day, Incomplete'
# The word the sentence explains is on screen, so the sentence is too.
- scrollUntilVisible:
    centerElement: true
    element:
      text: Incomplete means one or more entries did not include that nutrient.
    direction: DOWN
- assertVisible: Incomplete means one or more entries did not include that nutrient.
