appId: com.fitnessapp.dev
name: Exercise library filtering
---
- launchApp:
    clearState: true
# One uninterrupted pass: a populated library is narrowed, asked a question
# scrolling cannot answer, and then restored intact. The Sprint 29 suite proves
# each behavior from clean state in isolation; this proves they still hold beside
# everything else the regression run exercises, on a screen several other
# scenarios traverse.
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- runFlow:
    file: ../../flows/exercise/filter-exercise-library.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-library-equipment-filter-barbell
      MUSCLE_FILTER_ID: exercise-library-muscle-filter-chest
- scrollUntilVisible:
    element:
      id: exercise-library-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Barbell and Chest. 1 exercise.
- scrollUntilVisible:
    element:
      text: Edit Barbell Bench Press
    direction: DOWN
    centerElement: true
- assertVisible: Edit Barbell Bench Press
# No starter definition is both a dumbbell and a chest movement. The library says
# so, and the empty-library state is absent from the top of the screen where it
# would render.
- runFlow:
    file: ../../flows/exercise/filter-exercise-library.yaml
    env:
      EQUIPMENT_FILTER_ID: exercise-library-equipment-filter-dumbbell
      MUSCLE_FILTER_ID: exercise-library-muscle-filter-chest
- scrollUntilVisible:
    element:
      id: exercise-library-filter-summary
    direction: DOWN
    centerElement: true
- assertVisible: Filtered by Dumbbell and Chest. No exercises match these filters.
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- assertNotVisible: No exercises yet
- scrollUntilVisible:
    element:
      text: Clear filters
    direction: DOWN
    centerElement: true
- tapOn: Clear filters
- scrollUntilVisible:
    element:
      text: All exercises
    direction: DOWN
    centerElement: true
- assertVisible: All exercises
# Nothing the filter touched changed the catalog, reached through the library's
# own search because twenty-six definitions are far taller than one viewport.
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-search
- inputText: Burpee
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Burpee
    direction: DOWN
    centerElement: true
- assertVisible: Edit Burpee
- assertVisible: Add Burpee to favorites
