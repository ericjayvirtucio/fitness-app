appId: com.fitnessapp.dev
name: Completed session exercise removal
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow: ../../flows/exercise/create-alternate-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-two-exercise-workout.yaml
    env:
      PUSH_UP_REPETITIONS: '12'
      SQUAT_REPETITIONS: '100'
- runFlow: ../../flows/workout/open-completed-workout.yaml
# The second exercise's set, so it is a viewport below the first one's, and the
# detail carries a naming control above its summary. Off-screen content in a
# scroll view is absent from the hierarchy rather than merely invisible, so this
# is scrolled to rather than asserted where it used to sit.
- scrollUntilVisible:
    element:
      text: 'Performed set 1: 100 reps'
    direction: DOWN
    centerElement: true
- runFlow:
    file: ../../flows/workout/remove-completed-exercise.yaml
    env:
      EXERCISE_NAME: E2E Squat
      EXERCISE_POSITION: '2'
# A removal leaves the detail scrolled to where the removed exercise was, and the
# detail is taller than one viewport, so the surviving exercise's recorded set is
# above the fold and absent from the hierarchy until the flow scrolls back up.
- scrollUntilVisible:
    element:
      text: 'Performed set 1: 12 reps'
    direction: UP
    centerElement: true
- assertNotVisible: E2E Squat
# The removal ends on the completed detail, a pushed screen with no tab bar, and
# the reusable flows start from the Workout tab. Relaunch to a known root rather
# than guessing how many back gestures the stack needs.
- stopApp
- launchApp
# The counts are asserted on Progress, not on the history summary: that summary
# is a card carrying its own accessibilityLabel, so its numbers never reach the
# accessibility tree Maestro reads. The workout itself survives, because only
# its children changed.
- tapOn:
    id: tab-progress
- scrollUntilVisible:
    element:
      text: Performed exercises, 1
    direction: DOWN
- assertVisible: Completed workouts, 1
- assertVisible: Repetitions, 12
