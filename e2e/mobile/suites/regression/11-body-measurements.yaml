appId: com.fitnessapp.dev
name: Body measurement history
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/body-measurement/open-body-measurements.yaml
- assertVisible: No weight check-ins yet
- runFlow:
    file: ../../flows/body-measurement/log-weight-check-in.yaml
    env:
      CHECK_IN_TIME: '00:01'
      SHOULD_SET_TIME: 'true'
      UPDATE_PROFILE: 'yes'
      WEIGHT: '82.4'
- assertVisible: 'Weight check-in 82.4 kilograms.*'
- stopApp
- launchApp
- tapOn:
    id: tab-progress
- scrollUntilVisible:
    element:
      id: progress-body-weight
    direction: DOWN
- assertVisible: 'Latest recorded, 82.4 kg'
