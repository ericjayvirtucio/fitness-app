appId: com.fitnessapp.dev
name: Offline data restore
---
- launchApp:
    clearState: true
- runFlow: ../../flows/data-restore/open-data-restore.yaml
- assertVisible:
    id: data-restore-notice
- scrollUntilVisible:
    element:
      id: choose-data-restore-file
    direction: DOWN
- assertVisible:
    id: choose-data-restore-file
