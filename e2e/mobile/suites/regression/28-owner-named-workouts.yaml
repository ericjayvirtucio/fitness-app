appId: com.fitnessapp.dev
name: Owner-named workouts
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- runFlow:
    file: ../../flows/workout/rename-workout.yaml
    env:
      RENAME_CONTROL: rename-completed-workout
      NEW_NAME: E2E Leg Day
- assertVisible:
    id: completed-workout-screen
# The sprint suite proves the rename from each entry point, its refusal, and what
# it does to a record, one claim at a time from a clean installation. This proves
# something none of those do: that the chosen name is stored rather than held by
# the screen that set it, by reading it back from three separate surfaces after
# the process has been killed and restarted.
- stopApp
- launchApp
- runFlow: ../../flows/workout/open-workout-history.yaml
- scrollUntilVisible:
    element:
      id: completed-workout-card
    direction: DOWN
    centerElement: true
- assertVisible: 'Open E2E Leg Day,.*1 actual sets.*'
- scrollUntilVisible:
    element:
      text: Open performance history for E2E Push-up
    direction: DOWN
    centerElement: true
- tapOn: Open performance history for E2E Push-up
- assertVisible: Personal records
# The record's evidence follows the name, and its recorded value does not follow
# anything.
- assertVisible: 'Most recorded repetitions in a set, 12 repetitions, first recorded on .*, in E2E Leg Day, set 1'
- scrollUntilVisible:
    element:
      text: 'Open E2E Leg Day,.*12 repetitions'
    direction: DOWN
    centerElement: true
