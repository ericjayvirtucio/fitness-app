appId: com.fitnessapp.dev
name: Starter exercise library
---
- launchApp:
    clearState: true
# A fresh installation offers the starter set beside authoring rather than
# holding content nobody asked for.
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: No exercises yet
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- scrollUntilVisible:
    element:
      text: Added 26 exercises to your library.
    direction: DOWN
    centerElement: true
- assertVisible: Added 26 exercises to your library.
# What it wrote is ordinary catalog content, listed the way the library lists
# anything and favorited by nobody.
- scrollUntilVisible:
    element:
      text: Edit Burpee
    direction: UP
    centerElement: true
- assertVisible: Add Burpee to favorites
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
- assertNotVisible: No exercises yet
- scrollUntilVisible:
    element:
      text: Edit Burpee
    direction: DOWN
    centerElement: true
- assertVisible: Edit Burpee
