appId: com.fitnessapp.dev
name: Offline progress analytics
---
- launchApp:
    clearState: true
- runFlow: ../../flows/nutrition/log-one-time-entry.yaml
- runFlow: ../../flows/hydration/log-water-and-persist.yaml
- tapOn:
    id: tab-progress
- assertVisible: 89 kcal
- scrollUntilVisible:
    element:
      text: Total fluid
    direction: DOWN
- assertVisible: 500 mL
