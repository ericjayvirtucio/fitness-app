appId: com.fitnessapp.dev
name: Completed workout correction
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '100'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- runFlow:
    file: ../../flows/workout/correct-completed-set.yaml
    env:
      CORRECTED_REPETITIONS: '10'
      SET_NUMBER: '1'
- assertVisible: 'Performed set 1: 10 reps'
- runFlow: ../../flows/workout/open-exercise-personal-records.yaml
- assertVisible: 'Most recorded repetitions in a set, 10 repetitions, .*'
- assertNotVisible: 'Most recorded repetitions in a set, 100 repetitions, .*'
