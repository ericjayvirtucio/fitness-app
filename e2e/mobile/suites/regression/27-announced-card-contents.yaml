appId: com.fitnessapp.dev
name: Announced card contents
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/nutrition/log-one-time-entry.yaml
- runFlow: ../../flows/hydration/log-water-and-persist.yaml
# The sprint suite proves each screen's announcement from a clean installation,
# one screen at a time. This proves the names survive a traversal that visits
# every changed capability in one installation, and that they are composed from
# stored data rather than from anything the recording screens left behind, by
# reading them again after a relaunch.
- stopApp
- launchApp
# The control that a labelled card used to hide. Reaching it by name is the
# claim this whole scenario exists to keep true.
- tapOn:
    id: tab-today
- scrollUntilVisible:
    element:
      text: Change daily target
    direction: DOWN
    centerElement: true
- assertVisible: Change daily target
- tapOn:
    id: tab-nutrition
- assertVisible: 'Daily nutrition totals, 89 kcal, 1 entry, Protein: Incomplete,.*'
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: open-goals-energy
    direction: DOWN
- tapOn:
    id: open-goals-energy
- scrollUntilVisible:
    element:
      text: 'Profile-derived energy estimates,.*'
    direction: DOWN
    centerElement: true
- assertVisible: 'Profile-derived energy estimates, BMI, .*, Estimated maintenance, .* kcal/day'
