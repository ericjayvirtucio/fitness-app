appId: com.fitnessapp.dev
name: Completed workout exercise addition
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow: ../../flows/exercise/create-alternate-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- runFlow:
    file: ../../flows/workout/add-completed-exercise.yaml
    env:
      EXERCISE_NAME: E2E Squat
      REPETITIONS: '20'
- assertVisible: 'Performed set 1: 12 reps'
- scrollUntilVisible:
    element:
      text: 'Performed set 1: 20 reps'
    direction: DOWN
    centerElement: true
# The addition ends on the completed detail, a pushed screen with no tab bar,
# and the reusable flows start from the Workout tab. Relaunch to a known root
# rather than guessing how many back gestures the stack needs.
- stopApp
- launchApp
# The counts are asserted on Progress, not on the history summary: that summary
# is a card carrying its own accessibilityLabel, so its numbers never reach the
# accessibility tree Maestro reads. The workout count is unchanged, because only
# its children changed.
- tapOn:
    id: tab-progress
- scrollUntilVisible:
    element:
      text: Performed exercises, 2
    direction: DOWN
- assertVisible: Completed workouts, 1
- assertVisible: Repetitions, 32
