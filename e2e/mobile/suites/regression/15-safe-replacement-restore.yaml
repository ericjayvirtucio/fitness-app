appId: com.fitnessapp.dev
name: Safe replacement restore
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/data-lifecycle/open-replace-local-data.yaml
# Nothing that could replace data exists before a file has been validated, and
# the platform picker is not automated, so the suite stops at the application's
# own control and proves the records survived the visit.
- scrollUntilVisible:
    element:
      id: choose-replace-local-data-file
    direction: DOWN
- assertNotVisible:
    id: confirm-replace-local-data
- stopApp
- launchApp
- runFlow: ../../flows/shared/assert-primary-navigation.yaml
- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-height
