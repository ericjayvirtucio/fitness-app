appId: com.fitnessapp.dev
name: Imported exercises survive a relaunch
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 26 exercises to your library.
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
- assertNotVisible: No exercises yet
# A relaunch is a fresh visit, so the earlier result is gone while what it wrote
# remains.
- assertNotVisible: Added 26 exercises to your library.
- tapOn:
    id: exercise-library-search
- inputText: Burpee
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Burpee
    direction: DOWN
    centerElement: true
- assertVisible: Edit Burpee
