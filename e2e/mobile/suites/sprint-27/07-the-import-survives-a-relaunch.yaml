appId: com.fitnessapp.dev
name: Imported exercises survive a relaunch
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- scrollUntilVisible:
    element:
      text: Added 26 exercises to your library.
    direction: DOWN
    centerElement: true
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Exercise Library
    direction: DOWN
- tapOn: Open Exercise Library
- assertVisible: Exercise Library
- assertNotVisible: No exercises yet
- scrollUntilVisible:
    element:
      text: Edit Burpee
    direction: DOWN
    centerElement: true
- assertVisible: Edit Burpee
# A relaunch is a fresh visit, so the result of the earlier import is gone while
# what it wrote remains.
- assertNotVisible: Added 26 exercises to your library.
