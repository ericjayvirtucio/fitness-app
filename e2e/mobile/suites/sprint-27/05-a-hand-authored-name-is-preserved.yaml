appId: com.fitnessapp.dev
name: A hand-authored name is preserved and reported as skipped
---
- launchApp:
    clearState: true
# "Push-up" is a starter name, so the import must leave this definition exactly
# as the person wrote it rather than adding a second row beside it.
- runFlow:
    file: ../../flows/exercise/create-named-bodyweight-exercise.yaml
    env:
      EXERCISE_NAME: Push-up
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
- assertVisible: Added 25 exercises to your library. 1 was already in your library and was left unchanged.
# It never claims to have added what it skipped.
- assertNotVisible: Added 26 exercises to your library.
# The person's own definition is still there, and the starter entry that matched
# it was skipped rather than added beside it.
- tapOn:
    id: exercise-library-search
- inputText: Push-up
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Push-up
    direction: DOWN
    centerElement: true
- assertVisible: Edit Push-up
