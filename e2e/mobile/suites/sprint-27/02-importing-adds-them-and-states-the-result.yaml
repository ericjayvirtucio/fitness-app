appId: com.fitnessapp.dev
name: Importing adds the starter exercises and states what happened
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-starter-exercises.yaml
# The result appears where the control was, above the catalog it wrote, so it is
# reached without scrolling past twenty-six cards.
- assertVisible: Added 26 exercises to your library.
# A populated library is far taller than one viewport, so a definition is reached
# by searching rather than by scrolling to it. Search is the library's own
# control and it is what a person with a full catalog uses too.
- tapOn:
    id: exercise-library-search
- inputText: Burpee
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Burpee
    direction: DOWN
    centerElement: true
- assertVisible: Edit Burpee
# Nothing arrives favorited: the control still offers to add the favorite rather
# than to remove one.
- assertVisible: Add Burpee to favorites
