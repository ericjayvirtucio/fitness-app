appId: com.fitnessapp.dev
name: The nutrition diary announces every total it announced before the identity change
---
- launchApp:
    clearState: true
- runFlow: ../../flows/nutrition/log-one-time-entry.yaml
# The day's energy is now a hero numeral inside the totals card. That card
# carries an accessibilityLabel, so its children are unassertable and its own
# name is the whole claim: the string, the order, and every nutrient are
# unchanged, and the energy still leads.
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Daily nutrition totals,.*'
    direction: UP
- assertVisible: 'Daily nutrition totals, 89 kcal, 1 entry, Protein: .*, Carbohydrate: .*, Fat: .*, Fiber: .*, Sugar: .*, Sodium: .*'
# The entry below the card is unchanged and still reachable, which is what
# proves the taller card did not push it out of the screen's own scroll.
- scrollUntilVisible:
    centerElement: true
    element:
      text: '.*E2E Banana.*'
    direction: DOWN
- assertVisible: '.*E2E Banana.*'
