appId: com.fitnessapp.dev
name: Progress states every value it stated before, through the promoted stat tiles
---
- launchApp:
    clearState: true
- runFlow: ../../flows/nutrition/log-one-time-entry.yaml
- runFlow: ../../flows/hydration/log-water-and-persist.yaml
- tapOn:
    id: tab-progress
# Every value here was a local Metric and is now a StatTile. Both announce
# "label, value" as one accessibility element, so these selectors are the same
# ones regression/10 uses and a failure here means the sentence changed.
- assertVisible: 'Energy, 89 kcal'
- assertVisible: 'Logged days, 1'
- assertVisible: 'Entries, 1'
# The Nutrition card became outlined this sprint, so everything beneath it sits
# one border lower. Centre what the scroll stops on rather than assuming the
# offset, and reach the Hydration card by its first line.
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Total fluid, 500 mL'
    direction: DOWN
- assertVisible: 'Total fluid, 500 mL'
- assertVisible: 'Plain water, 500 mL'
- assertVisible: 'Other fluids, 0 mL'
# The period control is a SelectionField and is unchanged, so a selected option
# still carries checked state rather than color alone — and now renders legibly
# in dark appearance, which only manual QA can see.
- scrollUntilVisible:
    centerElement: true
    element:
      text: This Month
    direction: UP
- tapOn: This Month
- assertVisible: 'Energy, 89 kcal'
