appId: com.fitnessapp.dev
name: Mobile smoke
---
- launchApp:
    clearState: true
- runFlow: ../flows/shared/assert-primary-navigation.yaml
- scrollUntilVisible:
    element:
      text: Add fluid
    direction: DOWN
- tapOn: Add fluid
- tapOn: 500 mL
- scrollUntilVisible:
    element:
      text: Save fluid
    direction: DOWN
- tapOn: Save fluid
- assertVisible: 'Daily fluid totals, total 500 mL, plain water 500 mL, other fluids 0 mL, 1 entry'
- runFlow: ../flows/workout/empty-session-lifecycle.yaml
