appId: com.fitnessapp.dev
name: Refuse restoring when the app already holds information
---
- launchApp:
    clearState: true
- runFlow: ../../flows/profile/create-profile.yaml
- runFlow: ../../flows/data-restore/open-data-restore.yaml
- scrollUntilVisible:
    element:
      id: data-restore-blocked
    direction: DOWN
- assertVisible: This app already has information
- assertNotVisible:
    id: choose-data-restore-file
