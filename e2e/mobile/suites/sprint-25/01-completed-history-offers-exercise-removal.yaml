appId: com.fitnessapp.dev
name: Completed history offers exercise removal and stays historical
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow: ../../flows/exercise/create-alternate-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-two-exercise-workout.yaml
    env:
      PUSH_UP_REPETITIONS: '12'
      SQUAT_REPETITIONS: '20'
- runFlow: ../../flows/workout/open-completed-workout.yaml
- assertVisible: 'Performed set 1: 12 reps'
# The completed detail stays historical: it corrects and removes recorded work,
# and offers no active-workout control.
- assertNotVisible: Finish Workout
- assertNotVisible: Add Exercise
- assertNotVisible: Discard Workout
- scrollUntilVisible:
    element:
      text: Remove exercise 2, E2E Squat, from this workout
    direction: DOWN
    centerElement: true
- assertVisible: Remove exercise 1, E2E Push-up, from this workout
