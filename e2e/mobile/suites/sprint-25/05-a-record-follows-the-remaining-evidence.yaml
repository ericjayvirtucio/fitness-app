appId: com.fitnessapp.dev
name: A personal record follows the evidence a removal leaves behind
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow: ../../flows/exercise/create-alternate-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-two-exercise-workout.yaml
    env:
      PUSH_UP_REPETITIONS: '20'
      SQUAT_REPETITIONS: '5'
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-exercise-personal-records.yaml
- assertVisible: 'Most recorded repetitions in a set, 20 repetitions, .*'
- stopApp
- launchApp
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Workout History
    direction: DOWN
- tapOn: Open Workout History
- assertVisible: Workout History
# History lists the most recent workout first, so the older two-exercise workout
# is the second card.
- scrollUntilVisible:
    element:
      id: completed-workout-card
    direction: DOWN
- tapOn:
    id: completed-workout-card
    index: 1
- assertVisible:
    id: completed-workout-screen
- assertVisible: 'Performed set 1: 20 reps'
- runFlow:
    file: ../../flows/workout/remove-completed-exercise.yaml
    env:
      EXERCISE_NAME: E2E Push-up
      EXERCISE_POSITION: '1'
- stopApp
- launchApp
- runFlow: ../../flows/workout/open-exercise-personal-records.yaml
- assertVisible: 'Most recorded repetitions in a set, 12 repetitions, .*'
- assertNotVisible: 'Most recorded repetitions in a set, 20 repetitions, .*'
