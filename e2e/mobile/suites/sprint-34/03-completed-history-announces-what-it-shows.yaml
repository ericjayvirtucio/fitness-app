appId: com.fitnessapp.dev
name: Completed history announces its summary and what a change would do
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-completed-workout.yaml
# The summary card announced only its title, so neither number it displays could
# be proven. The elapsed time is wildcarded because it is real clock time.
- assertVisible: 'Completed workout summary, 1 actual sets, .* workout time'
# The correction screen states what a correction changes in a card that
# announced only "What this correction changes". The sentence is now part of the
# name, so the consequence a person is asked to accept is both audible and
# assertable.
- scrollUntilVisible:
    element:
      text: Correct recorded set 1 for E2E Push-up
    direction: DOWN
- tapOn: Correct recorded set 1 for E2E Push-up
- assertVisible: Correct recorded set
- assertVisible: 'What this correction changes, Correcting changes what this workout recorded. Personal records and progress may change. The workout stays completed, and its exercise and plan details are unchanged.'
- scrollUntilVisible:
    element:
      text: Cancel Correction
    direction: DOWN
- tapOn: Cancel Correction
- assertVisible:
    id: completed-workout-screen
