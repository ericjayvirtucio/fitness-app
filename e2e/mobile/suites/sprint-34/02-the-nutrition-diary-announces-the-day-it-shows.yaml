appId: com.fitnessapp.dev
name: The nutrition diary announces the day's totals it displays
---
- launchApp:
    clearState: true
- runFlow: ../../flows/nutrition/log-one-time-entry.yaml
# The totals card is one accessibility element, so its energy, entry count, and
# six nutrient lines were all silent behind "Daily nutrition totals". A
# one-time entry records energy without nutrient information, so this also
# proves the partly-absent case: the card announces the shorter contents it
# shows and claims nothing about what it does not know.
- assertVisible: 'Daily nutrition totals, 89 kcal, 1 entry, Protein: Incomplete,.*Incomplete means at least one entry has unknown information for that nutrient.'
