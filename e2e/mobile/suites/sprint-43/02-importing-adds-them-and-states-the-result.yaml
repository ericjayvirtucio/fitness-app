appId: com.fitnessapp.dev
name: Importing the expanded pack adds it and states what happened
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-expanded-exercises.yaml
# The result appears where the control was, above the catalog it wrote, so it
# is reached without scrolling past 189 cards.
- assertVisible: Added 189 exercises to your library.
# A populated library is far taller than one viewport, so a definition is
# reached by searching rather than by scrolling to it, exactly as the starter
# section's own scenarios do. These three searches sample three different
# equipment types and three different logging modes, so the pack's variety is
# checked rather than assumed from the count alone.
#
# Unlike the starter-only scenario, the scroll that reached "Add expanded
# exercise library" leaves the viewport below the search field rather than
# beside it, because the expanded section sits beneath the starter section.
# The search field is scrolled back to before every tap on it, here and after
# each result scroll below, rather than assumed still visible.
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-search
- inputText: Barbell Curl
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Barbell Curl
    direction: DOWN
    centerElement: true
- assertVisible: Edit Barbell Curl
- assertVisible: Barbell.*Biceps.*Weight \+ reps
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-search
- eraseText
- inputText: Kettlebell Windmill
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Kettlebell Windmill
    direction: DOWN
    centerElement: true
- assertVisible: Edit Kettlebell Windmill
- assertVisible: Kettlebell.*Core.*Weight \+ reps
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-search
- eraseText
- inputText: Assisted Sit-up
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit Assisted Sit-up
    direction: DOWN
    centerElement: true
- assertVisible: Edit Assisted Sit-up
- assertVisible: Machine.*Core.*Assistance \+ reps
# Nothing arrives favorited: the control still offers to add the favorite
# rather than to remove one.
- assertVisible: Add Assisted Sit-up to favorites
