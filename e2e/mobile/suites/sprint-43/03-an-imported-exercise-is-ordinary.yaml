appId: com.fitnessapp.dev
name: An exercise from the expanded pack can be favorited, renamed, and deleted
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-expanded-exercises.yaml
- assertVisible: Added 189 exercises to your library.
# A populated library is far taller than one viewport, so the exercise is
# reached by searching rather than by scrolling through the alphabet.
#
# The scroll that reached "Add expanded exercise library" leaves the viewport
# below the search field, because the expanded section sits beneath the
# starter section, so the search field is scrolled back to before it is
# tapped, here and again after returning from the rename below.
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-search
- inputText: Barbell Curl
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Add Barbell Curl to favorites
    direction: DOWN
    centerElement: true
- tapOn: Add Barbell Curl to favorites
# Favoriting reloads the library, which clears nothing the person typed, so the
# search results still hold the one exercise.
- scrollUntilVisible:
    element:
      text: Remove Barbell Curl from favorites
    direction: DOWN
    centerElement: true
- assertVisible: Remove Barbell Curl from favorites
- scrollUntilVisible:
    element:
      text: Edit Barbell Curl
    direction: UP
    centerElement: true
- tapOn: Edit Barbell Curl
- assertVisible: Edit exercise
- tapOn:
    id: exercise-name-input
- eraseText: 20
- inputText: E2E Renamed Expanded Movement
- swipe:
    start: 50%, 45%
    end: 50%, 40%
- scrollUntilVisible:
    element:
      text: Save exercise
    direction: DOWN
- tapOn: Save exercise
# Saving returns to the library, which was never unmounted and therefore still
# holds the query typed earlier. The renamed exercise no longer matches it, so
# the field is cleared before the new name is typed.
- assertVisible: Exercise Library
- scrollUntilVisible:
    element:
      id: exercise-library-search
    direction: UP
    centerElement: true
- tapOn:
    id: exercise-library-search
- eraseText: 20
- inputText: E2E Renamed
- swipe:
    start: 50%, 40%
    end: 50%, 35%
- scrollUntilVisible:
    element:
      text: Edit E2E Renamed Expanded Movement
    direction: DOWN
    centerElement: true
- tapOn: Edit E2E Renamed Expanded Movement
- scrollUntilVisible:
    element:
      text: Delete exercise
    direction: DOWN
    centerElement: true
- tapOn: Delete exercise
- assertVisible: Delete E2E Renamed Expanded Movement\? This cannot be undone.
- tapOn: Delete this exercise
- assertVisible: Exercise Library
- assertNotVisible: Edit E2E Renamed Expanded Movement
