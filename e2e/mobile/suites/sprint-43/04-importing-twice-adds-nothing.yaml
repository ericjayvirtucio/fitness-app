appId: com.fitnessapp.dev
name: Importing the expanded pack a second time adds nothing and says so
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/add-expanded-exercises.yaml
- assertVisible: Added 189 exercises to your library.
# The reusable flow starts from the Workout tab, and the library is a pushed
# screen with no tab bar, so return to a known root rather than guessing at
# back gestures.
- stopApp
- launchApp
- runFlow: ../../flows/exercise/add-expanded-exercises.yaml
- assertVisible: Your library already has all 189 of these exercises. Nothing was added.
# The second import claims nothing it did not do.
- assertNotVisible: Added 189 exercises to your library.
