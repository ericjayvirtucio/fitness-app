appId: com.fitnessapp.dev
name: Less assistance beats the record
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-assisted-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-assisted-workout.yaml
    env:
      ASSISTANCE: '20'
      REPETITIONS: '8'
- runFlow:
    file: ../../flows/workout/complete-assisted-workout.yaml
    env:
      ASSISTANCE: '15'
      REPETITIONS: '6'
- runFlow: ../../flows/workout/open-assisted-exercise-personal-records.yaml
# The smaller number is the record, which is the whole point of this category
# and the one thing a descending order would get backwards.
- assertVisible: 'Least recorded assistance in a set, 15 kilograms, .*'
- assertNotVisible: 'Least recorded assistance in a set, 20 kilograms, .*'
