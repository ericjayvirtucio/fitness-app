appId: com.fitnessapp.dev
name: An assisted set becomes a personal record
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-assisted-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-assisted-workout.yaml
    env:
      ASSISTANCE: '20'
      REPETITIONS: '8'
- runFlow: ../../flows/workout/open-assisted-exercise-personal-records.yaml
# A record card is one accessibility element, so the assertion reads the claim
# the way a screen reader does: category, value with spoken units, when it was
# first recorded, the workout that proves it, and the set.
- assertVisible: 'Least recorded assistance in a set, 20 kilograms, first recorded on .*, in Workout, set 1'
