appId: com.fitnessapp.dev
name: A completed set becomes the first personal record
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-exercise-personal-records.yaml
# A record card is one accessibility element, so the assertion reads the claim
# the way a screen reader does: category, value with spoken units, when it was
# first recorded, the workout that proves it, and the set.
- assertVisible: 'Most recorded repetitions in a set, 12 repetitions, first recorded on .*, in Workout, set 1'
