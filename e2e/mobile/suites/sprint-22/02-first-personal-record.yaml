appId: com.fitnessapp.dev
name: A completed set becomes the first personal record
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- runFlow:
    file: ../../flows/workout/complete-repetition-workout.yaml
    env:
      REPETITIONS: '12'
- runFlow: ../../flows/workout/open-exercise-personal-records.yaml
- assertVisible: Most recorded repetitions in a set
- assertVisible: 12 reps
- assertVisible: 'Workout · Set 1'
