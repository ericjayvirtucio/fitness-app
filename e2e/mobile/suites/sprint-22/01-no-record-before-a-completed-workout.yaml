appId: com.fitnessapp.dev
name: No personal record before a completed workout
---
- launchApp:
    clearState: true
- runFlow: ../../flows/exercise/create-exercise.yaml
- tapOn:
    id: tab-workout
- scrollUntilVisible:
    element:
      text: Open Workout History
    direction: DOWN
- tapOn: Open Workout History
- assertVisible: Workout History
# The empty state sits below the period controls and the summary card.
- scrollUntilVisible:
    element:
      text: No completed workouts yet
    direction: DOWN
- assertNotVisible: Exercise progress
- assertNotVisible: Personal records
