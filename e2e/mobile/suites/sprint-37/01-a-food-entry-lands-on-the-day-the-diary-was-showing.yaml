appId: com.fitnessapp.dev
name: A food entry lands on the day the diary was showing
---
- launchApp:
    clearState: true
- runFlow:
    file: ../../flows/nutrition/log-entry-to-a-past-day.yaml
    env:
      NAME: E2E Yesterday Banana
# The diary keeps the day it was showing across the save, so the entry it now
# lists is the entry that was just recorded onto that day.
- scrollUntilVisible:
    centerElement: true
    element:
      text: '.*E2E Yesterday Banana.*'
    direction: DOWN
# The row is one accessible element, so its own name carries the assertion.
- assertVisible: 'Edit food entry, E2E Yesterday Banana, 89 kcal.*'
- assertNotVisible: Nothing logged for this day
