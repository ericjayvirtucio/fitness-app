appId: com.fitnessapp.dev
name: Other fluids are stated rather than left to subtraction
---
- launchApp:
    clearState: true
- runFlow: ../../flows/hydration/log-water-and-persist.yaml
- runFlow:
    file: ../../flows/hydration/log-other-fluid.yaml
    env:
      VOLUME: '250'
# The daily screen already names the three components, and the period screen
# now names the same three. This is the claim: nobody has to subtract plain
# water from a total to learn what else they drank.
- assertVisible: 'Daily fluid totals, total 750 mL, plain water 500 mL, other fluids 250 mL, 2 entries'
- tapOn:
    id: tab-progress
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Total fluid, 750 mL'
    direction: DOWN
- assertVisible: 'Plain water, 500 mL'
- assertVisible: 'Other fluids, 250 mL'
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Average fluid per logged day, 750 mL'
    direction: DOWN
- assertVisible: 'Average plain water per logged day, 500 mL'
